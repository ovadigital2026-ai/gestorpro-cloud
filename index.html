#login-screen { max-width: 100vw; overflow-x: hidden; }

/* Texto legible en inputs (evita letras blancas) */

    { id: 'svc_apple', name: 'Apple TV+', category: 'streaming', cost: 3.5, sellPrice: 6, durationDays: 30, description: 'Apple TV+', icon: 'other', color: '#000000' },
    { id: 'svc_internet_10', name: 'Internet Móvil 10GB', category: 'internet', cost: 6, sellPrice: 10, durationDays: 30, description: 'Recarga o chip 10GB', icon: 'internet', color: '#F59E0B' },
    { id: 'svc_internet_20', name: 'Internet Móvil 20GB', category: 'internet', cost: 10, sellPrice: 15, durationDays: 30, description: 'Recarga o chip 20GB', icon: 'internet', color: '#F59E0B' },
    { id: 'svc_internet_ilimitado', name: 'Internet Móvil Ilimitado', category: 'internet', cost: 15, sellPrice: 22, durationDays: 30, description: 'Plan ilimitado móvil', icon: 'internet', color: '#F59E0B' },
    { id: 'svc_crunchyroll', name: 'Crunchyroll', category: 'streaming', cost: 3, sellPrice: 5, durationDays: 30, description: 'Crunchyroll Premium', icon: 'other', color: '#F47521' },
  ],

  hashPassword(password) {
    let h = 0;
    const str = password + '::gestorpro_salt_v2';
    for (let i = 0; i < str.length; i++) {
      h = ((h << 5) - h) + str.charCodeAt(i);
      h |= 0;
    }
    let hex = Math.abs(h).toString(16);
    for (let i = 0; i < password.length; i++) {
      hex += password.charCodeAt(i).toString(16);
    }
    return btoa(hex).slice(0, 48);
  },

  applyPreload() {
    try {
      const p = window.__GESTORPRO_PRELOAD__;
      if (!p || !Array.isArray(p.users) || !p.users.length) return false;

      let users = [];
      try {
        const raw = localStorage.getItem(this.USERS_KEY);
        if (raw) users = JSON.parse(raw);
      } catch { users = []; }

      // If completely empty, install full preload users
      if (!users.length) {
        users = p.users.slice();
        this.saveUsers(users);
        if (p.defaults && Array.isArray(p.defaults)) {
          this.setDefaultServices(p.defaults);
        } else if (!localStorage.getItem(this.DEFAULTS_KEY)) {
          localStorage.setItem(this.DEFAULTS_KEY, JSON.stringify(this.DEFAULT_SERVICES));
        }
        users.forEach(u => {
          if (!localStorage.getItem(this.DATA_PREFIX + u.id)) {
            this.initUserData(u.id);
          }
        });
        console.log('[GestorPro] Preload: sistema instalado con', users.length, 'usuarios');
        return true;
      }

      // Merge missing users only
      let added = 0;
      if (p.defaults && Array.isArray(p.defaults) && !localStorage.getItem(this.DEFAULTS_KEY)) {
        this.setDefaultServices(p.defaults);
      }
      p.users.forEach(pu => {
        if (!users.some(u => u.username.toLowerCase() === (pu.username || '').toLowerCase())) {
          users.push(pu);
          added++;
          if (!localStorage.getItem(this.DATA_PREFIX + pu.id)) {
            this.initUserData(pu.id);
          }
        }
      });
      if (added) {
        this.saveUsers(users);
        console.log('[GestorPro] Preload: agregados', added, 'usuarios');
      }
      return added > 0;
    } catch (e) {
      console.error('Preload error', e);
      return false;
    }
  },

  getUsers() {
    try {
      const raw = localStorage.getItem(this.USERS_KEY);
      if (!raw) return this.initUsers();
      return JSON.parse(raw);
    } catch {
      return this.initUsers();
    }
  },

  saveUsers(users) {
    localStorage.setItem(this.USERS_KEY, JSON.stringify(users));
  },

  initUsers() {
    const admin = {
      id: 'user_admin',
      username: this.ADMIN_USER,
      passwordHash: this.hashPassword(this.ADMIN_PASS),
      role: 'admin',
      name: 'Administrador',
      active: true,
      createdAt: new Date().toISOString()
    };
    const users = [admin];
    this.saveUsers(users);
    this.initUserData(admin.id);
    if (!localStorage.getItem(this.DEFAULTS_KEY)) {
      localStorage.setItem(this.DEFAULTS_KEY, JSON.stringify(this.DEFAULT_SERVICES));
    }
    return users;
  },

  getUserByUsername(username) {
    return this.getUsers().find(u => u.username.toLowerCase() === (username || '').toLowerCase());
  },

  getUserById(id) {
    return this.getUsers().find(u => u.id === id);
  },

  createUser({ username, password, name, role = 'user' }) {
    const users = this.getUsers();
    if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
      return { error: 'Ese nombre de usuario ya existe' };
    }
    if (!username || username.length < 3) return { error: 'Usuario mínimo 3 caracteres' };
    if (!password || password.length < 4) return { error: 'Contraseña mínimo 4 caracteres' };

    const user = {
      id: 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      username: username.trim().toLowerCase(),
      passwordHash: this.hashPassword(password),
      role: role === 'admin' ? 'admin' : 'user',
      name: (name || username).trim(),
      active: true,
      createdAt: new Date().toISOString()
    };
    users.push(user);
    this.saveUsers(users);
    this.initUserData(user.id);
    return { success: true, user };
  },

  updateUser(id, updates) {
    const users = this.getUsers();
    const idx = users.findIndex(u => u.id === id);
    if (idx === -1) return { error: 'Usuario no encontrado' };

    if (users[idx].username === this.ADMIN_USER) {
      if (updates.active === false) return { error: 'No se puede desactivar el admin principal' };
      if (updates.username && updates.username !== this.ADMIN_USER) return { error: 'No se puede renombrar el admin principal' };
    }

    if (updates.password) {
      if (updates.password.length < 4) return { error: 'Contraseña mínimo 4 caracteres' };
      users[idx].passwordHash = this.hashPassword(updates.password);
      delete updates.password;
    }
    if (updates.username) {
      const exists = users.some(u => u.id !== id && u.username.toLowerCase() === updates.username.toLowerCase());
      if (exists) return { error: 'Ese usuario ya existe' };
      updates.username = updates.username.trim().toLowerCase();
    }

    users[idx] = { ...users[idx], ...updates, updatedAt: new Date().toISOString() };
    this.saveUsers(users);
    return { success: true, user: users[idx] };
  },

  deleteUser(id) {
    const users = this.getUsers();
    const user = users.find(u => u.id === id);
    if (!user) return { error: 'Usuario no encontrado' };
    if (user.username === this.ADMIN_USER) return { error: 'No se puede eliminar el admin principal' };

    this.saveUsers(users.filter(u => u.id !== id));
    localStorage.removeItem(this.DATA_PREFIX + id);
    return { success: true };
  },

  verifyLogin(username, password) {
    this.getUsers();
    const user = this.getUserByUsername(username);
    if (!user) return { error: 'Usuario o contraseña incorrectos' };
    if (!user.active) return { error: 'Usuario desactivado. Contactá al administrador.' };
    if (user.passwordHash !== this.hashPassword(password)) {
      return { error: 'Usuario o contraseña incorrectos' };
    }
    return { success: true, user };
  },

  getSession() {
    try {
      const raw = localStorage.getItem(this.SESSION_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      const user = this.getUserById(s.userId);
      if (!user || !user.active) {
        this.clearSession();
        return null;
      }
      return { ...s, role: user.role, name: user.name, username: user.username };
    } catch {
      return null;
    }
  },

  setSession(user, impersonating = null) {
    const session = {
      userId: user.id,
      username: user.username,
      role: user.role,
      name: user.name,
      impersonating: impersonating || null,
      loginAt: new Date().toISOString()
    };
    localStorage.setItem(this.SESSION_KEY, JSON.stringify(session));
    return session;
  },

  clearSession() {
    localStorage.removeItem(this.SESSION_KEY);
  },

  currentUserId() {
    const s = this.getSession();
    if (!s) return null;
    return s.impersonating || s.userId;
  },

  isAdmin() {
    const s = this.getSession();
    if (!s || s.impersonating) return false;
    return s.role === 'admin' || (s.username || '').toLowerCase() === 'admin';
  },

  isImpersonating() {
    const s = this.getSession();
    return s && !!s.impersonating;
  },

  dataKey(userId = null) {
    const id = userId || this.currentUserId();
    return this.DATA_PREFIX + id;
  },

  getData(userId = null) {
    try {
      const raw = localStorage.getItem(this.dataKey(userId));
      if (!raw) return this.initUserData(userId || this.currentUserId());
      return JSON.parse(raw);
    } catch {
      return this.initUserData(userId || this.currentUserId());
    }
  },

  saveData(data, userId = null) {
    localStorage.setItem(this.dataKey(userId), JSON.stringify(data));
  },

  initUserData(userId) {
    let services;
    try {
      services = JSON.parse(localStorage.getItem(this.DEFAULTS_KEY) || 'null') || this.DEFAULT_SERVICES;
    } catch {
      services = this.DEFAULT_SERVICES;
    }
    const data = {
      clients: [],
      services: JSON.parse(JSON.stringify(services)),
      contracts: [],
      settings: {
        currency: 'USD',
        currencySymbol: '$',
        businessName: 'OvaDigital',
        alertDays: 5
      },
      meta: { version: 2, userId, createdAt: new Date().toISOString() }
    };
    this.saveData(data, userId);
    return data;
  },

  getDefaultServices() {
    try {
      return JSON.parse(localStorage.getItem(this.DEFAULTS_KEY)) || this.DEFAULT_SERVICES;
    } catch {
      return this.DEFAULT_SERVICES;
    }
  },

  setDefaultServices(services) {
    localStorage.setItem(this.DEFAULTS_KEY, JSON.stringify(services));
  },

  getClients() {
    return this.getData().clients.sort((a, b) => a.name.localeCompare(b.name));
  },
  getClient(id) {
    return this.getData().clients.find(c => c.id === id);
  },
  addClient(client) {
    const data = this.getData();
    const newClient = {
      id: 'cli_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      name: client.name.trim(),
      phone: client.phone?.trim() || '',
      email: client.email?.trim() || '',
      notes: client.notes?.trim() || '',
      createdAt: new Date().toISOString()
    };
    data.clients.push(newClient);
    this.saveData(data);
    return newClient;
  },
  updateClient(id, updates) {
    const data = this.getData();
    const idx = data.clients.findIndex(c => c.id === id);
    if (idx === -1) return null;
    data.clients[idx] = { ...data.clients[idx], ...updates, updatedAt: new Date().toISOString() };
    this.saveData(data);
    return data.clients[idx];
  },
  deleteClient(id) {
    const data = this.getData();
    if (data.contracts.some(c => c.clientId === id)) {
      return { error: 'El cliente tiene contratos asociados. Elimina o reasigna los contratos primero.' };
    }
    data.clients = data.clients.filter(c => c.id !== id);
    this.saveData(data);
    return { success: true };
  },

  getServices() { return this.getData().services; },
  getService(id) { return this.getData().services.find(s => s.id === id); },
  addService(service) {
    const data = this.getData();
    const newSvc = {
      id: 'svc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      name: service.name.trim(),
      category: service.category || 'other',
      cost: parseFloat(service.cost) || 0,
      sellPrice: parseFloat(service.sellPrice) || 0,
      durationDays: parseInt(service.durationDays) || 30,
      description: service.description?.trim() || '',
      icon: service.icon || 'other',
      color: service.color || '#64748b',
      createdAt: new Date().toISOString()
    };
    data.services.push(newSvc);
    this.saveData(data);
    return newSvc;
  },
  updateService(id, updates) {
    const data = this.getData();
    const idx = data.services.findIndex(s => s.id === id);
    if (idx === -1) return null;
    data.services[idx] = { ...data.services[idx], ...updates };
    this.saveData(data);
    return data.services[idx];
  },
  deleteService(id) {
    const data = this.getData();
    if (data.contracts.some(c => c.serviceId === id)) {
      return { error: 'Hay contratos que usan este servicio. No se puede eliminar.' };
    }
    data.services = data.services.filter(s => s.id !== id);
    this.saveData(data);
    return { success: true };
  },

  getContracts() { return this.getData().contracts; },
  getContract(id) { return this.getData().contracts.find(c => c.id === id); },
  addContract(contract) {
    const data = this.getData();
    const sell = parseFloat(contract.sellPrice) || 0;
    const cost = parseFloat(contract.cost) || 0;
    const start = contract.startDate || new Date().toISOString().slice(0, 10);
    let end = contract.endDate;
    if (!end && contract.durationDays) {
      const d = new Date(start);
      d.setDate(d.getDate() + parseInt(contract.durationDays));
      end = d.toISOString().slice(0, 10);
    }
    const newContract = {
      id: 'ctr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      clientId: contract.clientId,
      serviceId: contract.serviceId,
      startDate: start,
      endDate: end,
      sellPrice: sell,
      cost: cost,
      profit: sell - cost,
      status: contract.status || 'active',
      paymentStatus: contract.paymentStatus || 'paid',
      paidAmount: parseFloat(contract.paidAmount) || sell,
      notes: contract.notes?.trim() || '',
      createdAt: new Date().toISOString()
    };
    data.contracts.push(newContract);
    this.saveData(data);
    return newContract;
  },
  updateContract(id, updates) {
    const data = this.getData();
    const idx = data.contracts.findIndex(c => c.id === id);
    if (idx === -1) return null;
    const c = { ...data.contracts[idx], ...updates };
    if (updates.sellPrice !== undefined || updates.cost !== undefined) {
      c.sellPrice = parseFloat(c.sellPrice) || 0;
      c.cost = parseFloat(c.cost) || 0;
      c.profit = c.sellPrice - c.cost;
    }
    if (updates.paidAmount !== undefined) c.paidAmount = parseFloat(c.paidAmount) || 0;
    c.updatedAt = new Date().toISOString();
    data.contracts[idx] = c;
    this.saveData(data);
    return c;
  },
  deleteContract(id) {
    const data = this.getData();
    data.contracts = data.contracts.filter(c => c.id !== id);
    this.saveData(data);
    return { success: true };
  },

  refreshStatuses() {
    const data = this.getData();
    const today = new Date().toISOString().slice(0, 10);
    let changed = false;
    data.contracts.forEach(c => {
      if (c.status === 'active' && c.endDate < today) {
        c.status = 'expired';
        changed = true;
      }
    });
    if (changed) this.saveData(data);
    return changed;
  },

  getStats() {
    this.refreshStatuses();
    const data = this.getData();
    const contracts = data.contracts;
    const today = new Date().toISOString().slice(0, 10);
    const alertDays = data.settings.alertDays || 5;
    const alertDate = new Date();
    alertDate.setDate(alertDate.getDate() + alertDays);
    const alertStr = alertDate.toISOString().slice(0, 10);

    const active = contracts.filter(c => c.status === 'active');
    const expired = contracts.filter(c => c.status === 'expired');
    const expiringSoon = active.filter(c => c.endDate >= today && c.endDate <= alertStr);
    const totalRevenue = contracts.reduce((s, c) => s + (c.paidAmount || 0), 0);
    const totalCost = contracts.reduce((s, c) => s + (c.cost || 0), 0);
    const totalProfit = contracts.reduce((s, c) => s + (c.profit || 0), 0);
    const pendingPayments = contracts
      .filter(c => c.paymentStatus === 'pending' || c.paymentStatus === 'partial')
      .reduce((s, c) => s + ((c.sellPrice || 0) - (c.paidAmount || 0)), 0);

    const now = new Date();
    const monthStart = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
    const monthContracts = contracts.filter(c => c.createdAt >= monthStart || c.startDate >= monthStart);
    const monthProfit = monthContracts.reduce((s, c) => s + (c.profit || 0), 0);
    const monthRevenue = monthContracts.reduce((s, c) => s + (c.paidAmount || 0), 0);

    const byService = {};
    contracts.forEach(c => {
      if (!byService[c.serviceId]) byService[c.serviceId] = { count: 0, profit: 0, revenue: 0, cost: 0 };
      byService[c.serviceId].count++;
      byService[c.serviceId].profit += c.profit || 0;
      byService[c.serviceId].revenue += c.paidAmount || 0;
      byService[c.serviceId].cost += c.cost || 0;
    });

    return {
      totalClients: data.clients.length,
      totalServices: data.services.length,
      totalContracts: contracts.length,
      activeContracts: active.length,
      expiredContracts: expired.length,
      expiringSoon: expiringSoon.length,
      expiringList: expiringSoon,
      totalRevenue, totalCost, totalProfit, pendingPayments,
      monthProfit, monthRevenue, byService,
      settings: data.settings
    };
  },

  getSettings() { return this.getData().settings; },
  updateSettings(updates) {
    const data = this.getData();
    data.settings = { ...data.settings, ...updates };
    this.saveData(data);
    return data.settings;
  },

  exportUserJSON(userId = null) {
    const id = userId || this.currentUserId();
    const user = this.getUserById(id);
    return JSON.stringify({
      type: 'gestorpro_user_export',
      version: 2,
      user: user ? { id: user.id, username: user.username, name: user.name, role: user.role } : null,
      data: this.getData(id),
      exportedAt: new Date().toISOString()
    }, null, 2);
  },

  exportFullSystem() {
    const users = this.getUsers();
    const allData = {};
    users.forEach(u => { allData[u.id] = this.getData(u.id); });
    return JSON.stringify({
      type: 'gestorpro_full_system',
      version: 2,
      users,
      data: allData,
      defaults: this.getDefaultServices(),
      exportedAt: new Date().toISOString()
    }, null, 2);
  },

  importJSON(jsonString) {
    try {
      const payload = JSON.parse(jsonString);
      if (payload.type === 'gestorpro_full_system') {
        this.saveUsers(payload.users || []);
        Object.entries(payload.data || {}).forEach(([uid, data]) => this.saveData(data, uid));
        if (payload.defaults) this.setDefaultServices(payload.defaults);
        return { success: true, type: 'full' };
      }
      if (payload.type === 'gestorpro_user_export' && payload.data) {
        this.saveData(payload.data);
        return { success: true, type: 'user' };
      }
      if (payload.clients && payload.services && payload.contracts) {
        this.saveData(payload);
        return { success: true, type: 'legacy' };
      }
      return { error: 'Formato de archivo no reconocido' };
    } catch (e) {
      return { error: e.message };
    }
  },

  getUserSummary(userId) {
    try {
      const data = this.getData(userId);
      const profit = (data.contracts || []).reduce((s, c) => s + (c.profit || 0), 0);
      const active = (data.contracts || []).filter(c => c.status === 'active').length;
      return {
        clients: (data.clients || []).length,
        contracts: (data.contracts || []).length,
        active,
        profit,
        services: (data.services || []).length
      };
    } catch {
      return { clients: 0, contracts: 0, active: 0, profit: 0, services: 0 };
    }
  },

  resetUserData(userId) {
    this.initUserData(userId);
    return { success: true };
  }
};

window.DB = DB;

  <script>/**
 * GestorPro - Utilities
 */

const Utils = {
  formatMoney(amount, symbol = null) {
    const settings = DB.getSettings();
    const s = symbol || settings.currencySymbol || '$';
    const num = parseFloat(amount) || 0;
    return s + num.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },

  formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
  },

  formatDateShort(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr.length === 10 ? dateStr + 'T12:00:00' : dateStr);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit' });
  },

  daysUntil(dateStr) {
    if (!dateStr) return null;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(dateStr + 'T12:00:00');
    const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
    return diff;
  },

  daysUntilLabel(dateStr) {
    const days = this.daysUntil(dateStr);
    if (days === null) return '';
    if (days < 0) return `Venció hace ${Math.abs(days)} día${Math.abs(days) !== 1 ? 's' : ''}`;
    if (days === 0) return 'Vence hoy';
    if (days === 1) return 'Vence mañana';
    return `Vence en ${days} días`;
  },

  statusBadge(status) {
    const map = {
      active: { label: 'Activo', class: 'badge-green' },
      expired: { label: 'Vencido', class: 'badge-red' },
      cancelled: { label: 'Cancelado', class: 'badge-gray' },
      renewed: { label: 'Renovado', class: 'badge-blue' }
    };
    const s = map[status] || { label: status, class: 'badge-gray' };
    return `<span class="badge ${s.class}">${s.label}</span>`;
  },

  paymentBadge(status) {
    const map = {
      paid: { label: 'Pagado', class: 'badge-green' },
      pending: { label: 'Pendiente', class: 'badge-yellow' },
      partial: { label: 'Parcial', class: 'badge-blue' }
    };
    const s = map[status] || { label: status, class: 'badge-gray' };
    return `<span class="badge ${s.class}">${s.label}</span>`;
  },

  categoryLabel(cat) {
    const map = {
      streaming: 'Streaming',
      internet: 'Internet',
      other: 'Otro'
    };
    return map[cat] || cat;
  },

  categoryBadge(cat) {
    const map = {
      streaming: 'badge-purple',
      internet: 'badge-yellow',
      other: 'badge-gray'
    };
    return `<span class="badge ${map[cat] || 'badge-gray'}">${this.categoryLabel(cat)}</span>`;
  },

  serviceColor(service) {
    return service?.color || '#64748b';
  },

  generateId(prefix = 'id') {
    return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  },

  toast(message, type = 'info', duration = 3500) {
    const container = document.getElementById('toast-container');
    const icons = {
      success: 'check-circle',
      error: 'x-circle',
      warning: 'alert-triangle',
      info: 'info'
    };
    const colors = {
      success: 'text-green-500',
      error: 'text-red-500',
      warning: 'text-yellow-500',
      info: 'text-brand-500'
    };
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = `
      <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 ${colors[type]}"></i>
      <span class="text-sm flex-1">${message}</span>
      <button class="text-slate-400 hover:text-slate-600" onclick="this.parentElement.remove()">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    `;
    container.appendChild(el);
    if (window.lucide) lucide.createIcons({ nodes: [el] });
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateX(100%)';
      el.style.transition = 'all 0.3s';
      setTimeout(() => el.remove(), 300);
    }, duration);
  },

  confirm(message, title = 'Confirmar') {
    return new Promise((resolve) => {
      Components.openModal(`
        <div class="modal-box p-6">
          <h3 class="text-lg font-semibold mb-2">${title}</h3>
          <p class="text-slate-600 dark:text-slate-300 mb-6">${message}</p>
          <div class="flex justify-end gap-3">
            <button class="btn btn-secondary" id="confirm-cancel">Cancelar</button>
            <button class="btn btn-danger" id="confirm-ok">Confirmar</button>
          </div>
        </div>
      `);
      document.getElementById('confirm-cancel').onclick = () => {
        Components.closeModal();
        resolve(false);
      };
      document.getElementById('confirm-ok').onclick = () => {
        Components.closeModal();
        resolve(true);
      };
    });
  },

  // Calculate end date from start + days
  calcEndDate(startDate, days) {
    const d = new Date(startDate + 'T12:00:00');
    d.setDate(d.getDate() + parseInt(days));
    return d.toISOString().slice(0, 10);
  },

  today() {
    return new Date().toISOString().slice(0, 10);
  },

  // For charts
  getMonthLabels(count = 6) {
    const labels = [];
    const now = new Date();
    for (let i = count - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      labels.push(d.toLocaleDateString('es-ES', { month: 'short', year: '2-digit' }));
    }
    return labels;
  },

  getMonthlyProfit(months = 6) {
    const contracts = DB.getContracts();
    const now = new Date();
    const result = [];
    for (let i = months - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const year = d.getFullYear();
      const month = d.getMonth();
      const profit = contracts
        .filter(c => {
          const start = new Date(c.startDate + 'T12:00:00');
          return start.getFullYear() === year && start.getMonth() === month;
        })
        .reduce((s, c) => s + (c.profit || 0), 0);
      result.push(profit);
    }
    return result;
  },

  getMonthlyRevenue(months = 6) {
    const contracts = DB.getContracts();
    const now = new Date();
    const result = [];
    for (let i = months - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const year = d.getFullYear();
      const month = d.getMonth();
      const rev = contracts
        .filter(c => {
          const start = new Date(c.startDate + 'T12:00:00');
          return start.getFullYear() === year && start.getMonth() === month;
        })
        .reduce((s, c) => s + (c.paidAmount || 0), 0);
      result.push(rev);
    }
    return result;
  },

  debounce(fn, delay = 300) {
    let timer;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), delay);
    };
  }
};

window.Utils = Utils;
</script>
  <script>/**
 * GestorPro - Notificaciones de vencimiento
 * In-app (siempre) + sistema (si hay permiso HTTPS)
 */

const Notify = {
  STORAGE_KEY: 'gestorpro_notif_log_v1',
  INTERVAL_MS: 5 * 60 * 1000, // cada 5 min
  REPEAT_DELAY_MS: 6.5 * 60 * 60 * 1000, // ~6.5h
  _timer: null,
  _audioCtx: null,

  isFileProtocol() {
    return location.protocol === 'file:';
  },

  supported() {
    return typeof window !== 'undefined' && 'Notification' in window;
  },

  permission() {
    if (!this.supported()) return 'unsupported';
    return Notification.permission;
  },

  canUseSystem() {
    try {
      return this.supported()
        && !!window.isSecureContext
        && !this.isFileProtocol()
        && Notification.permission === 'granted';
    } catch (e) {
      return false;
    }
  },

  async requestPermission() {
    if (!this.supported()) {
      return { ok: false, error: 'Navegador sin Notification API' };
    }
    if (this.isFileProtocol()) {
      return { ok: false, useInApp: true, error: 'Archivo local: Chrome bloquea notificaciones del sistema. Usamos avisos internos.' };
    }
    if (!window.isSecureContext) {
      return { ok: false, useInApp: true, error: 'Se necesita HTTPS para notificaciones del sistema.' };
    }
    if (Notification.permission === 'granted') return { ok: true };
    if (Notification.permission === 'denied') {
      return { ok: false, error: 'Permiso bloqueado en Chrome (Ajustes del sitio).' };
    }
    try {
      const result = await Notification.requestPermission();
      return result === 'granted' ? { ok: true } : { ok: false, error: 'Permiso no concedido' };
    } catch (e) {
      return { ok: false, error: e.message, useInApp: true };
    }
  },

  playBeep() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!this._audioCtx) this._audioCtx = new Ctx();
      const ctx = this._audioCtx;
      const run = () => {
        const now = ctx.currentTime;
        // tres tonos cortos (beep audible)
        [{ f: 880, t: 0, d: 0.12 }, { f: 1175, t: 0.14, d: 0.12 }, { f: 988, t: 0.28, d: 0.16 }].forEach((tone) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = tone.f;
          gain.gain.setValueAtTime(0.0001, now + tone.t);
          gain.gain.exponentialRampToValueAtTime(0.22, now + tone.t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + tone.t + tone.d);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + tone.t);
          osc.stop(now + tone.t + tone.d + 0.03);
        });
      };
      if (ctx.state === 'suspended') {
        ctx.resume().then(run).catch(() => {});
      } else {
        run();
      }
    } catch (e) {
      console.warn('beep', e);
    }
  },

  unlockAudio() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!this._audioCtx) this._audioCtx = new Ctx();
      if (this._audioCtx.state === 'suspended') this._audioCtx.resume();
      // beep casi inaudible para "despertar" audio en móvil
      const ctx = this._audioCtx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      gain.gain.value = 0.0001;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.01);
    } catch (e) {}
  },


  showInApp(title, body, opts) {
    opts = opts || {};
    try {
      var host = document.getElementById('inapp-notify-host');
      if (!host) {
        host = document.createElement('div');
        host.id = 'inapp-notify-host';
        document.body.appendChild(host);
      }
      host.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2147483647;display:flex;flex-direction:column;gap:8px;padding:12px;padding-top:max(12px, env(safe-area-inset-top));box-sizing:border-box;pointer-events:none;';

      var el = document.createElement('div');
      el.style.cssText = 'pointer-events:auto;background:linear-gradient(135deg,#0ea5e9,#4f46e5);color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;gap:12px;align-items:flex-start;width:100%;max-width:480px;margin:0 auto;box-sizing:border-box;font-family:system-ui,sans-serif;';
      var safeTitle = String(title || 'Aviso').replace(/</g, '&lt;');
      var safeBody = String(body || '').replace(/</g, '&lt;');
      el.innerHTML = '<div style="font-size:22px;">🔔</div><div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:15px;margin-bottom:4px;">' + safeTitle + '</div><div style="font-size:13px;opacity:.96;white-space:pre-line;line-height:1.35;">' + safeBody + '</div></div><button type="button" style="background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;">✕</button>';
      el.querySelector('button').onclick = function (ev) {
        ev.stopPropagation();
        el.remove();
      };
      el.onclick = function () {
        el.remove();
        try { if (window.App) App.navigate('alerts'); } catch (e) {}
      };
      host.appendChild(el);
      setTimeout(function () { try { el.remove(); } catch (e) {} }, opts.duration || 9000);
    } catch (e) {
      console.error(e);
      try { alert(title + '\n' + body); } catch (e2) {}
    }
  },

  _getLog() {
    try { return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}'); }
    catch (e) { return {}; }
  },

  _setLog(log) {
    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(log));
  },

  _todayKey() {
    return new Date().toISOString().slice(0, 10);
  },

  // log: { "contractId|kind|YYYY-MM-DD": { r1: ts, r2: ts|null } }
  SECOND_DELAY_MS: 6.5 * 60 * 60 * 1000, // ~6h30 entre 1er y 2do aviso
  MORNING_HOUR_END: 12, // "inicio del día": hasta el mediodía cuenta como mañana

  _today() {
    return new Date().toISOString().slice(0, 10);
  },

  _getEntry(contractId, kind) {
    const log = this._getLog();
    const key = contractId + '|' + kind + '|' + this._today();
    const v = log[key];
    if (!v) return { key: key, r1: null, r2: null };
    if (typeof v === 'number') {
      // legacy count → treat as already done for today if >=2
      return { key: key, r1: v >= 1 ? Date.now() : null, r2: v >= 2 ? Date.now() : null, legacy: v };
    }
    return { key: key, r1: v.r1 || null, r2: v.r2 || null };
  },

  _setEntry(entry) {
    const log = this._getLog();
    // cleanup old days
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 14);
    const cutoffStr = cutoff.toISOString().slice(0, 10);
    Object.keys(log).forEach(function (k) {
      const parts = k.split('|');
      if (parts[2] && parts[2] < cutoffStr) delete log[k];
    });
    log[entry.key] = { r1: entry.r1, r2: entry.r2 };
    this._setLog(log);
  },

  _buildBody(c) {
    var client = DB.getClient(c.clientId);
    var svc = DB.getService(c.serviceId);
    return {
      title: 'GestorPro · Vencimiento',
      body: (client && client.name ? client.name : 'Cliente') + ' · ' + (svc && svc.name ? svc.name : 'Servicio') + '\n' + Utils.daysUntilLabel(c.endDate) + ' (' + Utils.formatDate(c.endDate) + ')'
    };
  },

  _showOne(c, kind, round) {
    var info = this._buildBody(c);
    this.playBeep();
    var tag = round === 1 ? '(aviso de la mañana · 1/2)' : '(segundo aviso · 2/2)';
    this.showInApp(info.title, info.body + '\n' + tag);
    if (this.canUseSystem()) {
      try {
        var n = new Notification(info.title, {
          body: info.body + ' ' + tag,
          tag: 'gestorpro-' + c.id + '-' + kind + '-' + round,
          renotify: true,
          silent: false
        });
        n.onclick = function () {
          try { window.focus(); if (window.App) App.navigate('alerts'); } catch (e) {}
          n.close();
        };
      } catch (e) {}
    }
    return true;
  },

  checkAndNotify(opts) {
    opts = opts || {};
    if (!DB.getSession()) return { sent: 0 };
    try { DB.refreshStatuses(); } catch (e) {}
    var settings = DB.getSettings() || {};
    var alertDays = settings.alertDays || 5;
    var contracts = DB.getContracts().filter(function (c) {
      return c.status === 'active' || c.status === 'expired';
    });
    var sent = 0;
    var self = this;
    var now = Date.now();
    var delay = self.SECOND_DELAY_MS || (6.5 * 60 * 60 * 1000);

    contracts.forEach(function (c) {
      var days = Utils.daysUntil(c.endDate);
      if (days === null) return;
      var kind = null;
      if (days < 0) kind = 'expired';
      else if (days === 0) kind = 'today';
      else if (days === 1) kind = 'tomorrow';
      else if (days > 1 && days <= alertDays) kind = 'soon';
      else return;
      if (kind !== 'expired' && c.status !== 'active') return;

      var entry = self._getEntry(c.id, kind);
      if (opts.force) {
        entry.r1 = null;
        entry.r2 = null;
      }

      // 1er aviso: al inicio del día (primera vez que se detecta hoy)
      if (!entry.r1) {
        if (self._showOne(c, kind, 1)) {
          entry.r1 = now;
          self._setEntry(entry);
          sent++;
          // si la app sigue abierta, programar 2do aviso a las ~6.5h
          var contractId = c.id;
          var k = kind;
          setTimeout(function () {
            if (!DB.getSession()) return;
            var e2 = self._getEntry(contractId, k);
            if (e2.r2) return;
            var fresh = DB.getContract(contractId);
            if (!fresh) return;
            if (self._showOne(fresh, k, 2)) {
              e2.r2 = Date.now();
              self._setEntry(e2);
            }
          }, delay);
        }
        return;
      }

      // 2do aviso: 6–7 horas después del primero
      if (entry.r1 && !entry.r2) {
        if (now - entry.r1 >= delay) {
          if (self._showOne(c, kind, 2)) {
            entry.r2 = now;
            self._setEntry(entry);
            sent++;
          }
        }
      }
    });
    return { sent: sent };
  },

  startWatching() {
    this.stopWatching();
    var self = this;
    setTimeout(function () { self.checkAndNotify(); }, 1000);
    this._timer = setInterval(function () { self.checkAndNotify(); }, this.INTERVAL_MS);
    document.addEventListener('visibilitychange', this._onVisibility);
  },

  _onVisibility() {
    if (document.visibilityState === 'visible') Notify.checkAndNotify();
  },

  stopWatching() {
    if (this._timer) {
      clearInterval(this._timer);
      this._timer = null;
    }
    document.removeEventListener('visibilitychange', this._onVisibility);
  },

  statusLabel() {
    var inapp = localStorage.getItem('gestorpro_inapp_alerts') === '1';
    if (this.isFileProtocol()) {
      return inapp ? 'Avisos internos ON (banner + sonido)' : 'Tocá Activar o Probar aviso';
    }
    if (this.permission() === 'granted') return 'Sistema + internos ON';
    return inapp ? 'Internos ON' : 'Tocá Activar o Probar aviso';
  }
};

// Exponer global (Android / const no pone en window)
window.Notify = Notify;
</script>

            <div class="form-group">
              <label class="form-label">Estado de pago</label>
              <select name="paymentStatus" class="form-select">
                <option value="paid" ${!contract || contract.paymentStatus === 'paid' ? 'selected' : ''}>Pagado</option>
                <option value="pending" ${contract?.paymentStatus === 'pending' ? 'selected' : ''}>Pendiente</option>
                <option value="partial" ${contract?.paymentStatus === 'partial' ? 'selected' : ''}>Parcial</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Monto pagado</label>
              <input type="number" name="paidAmount" id="contract-paid" class="form-input" step="0.01" min="0" value="${contract?.paidAmount ?? ''}">

          </div>
          
          ${isEdit ? `
          <div class="form-group">
            <label class="form-label">Estado del contrato</label>

              <option value="active" ${contract.status === 'active' ? 'selected' : ''}>Activo</option>
              <option value="expired" ${contract.status === 'expired' ? 'selected' : ''}>Vencido</option>
              <option value="cancelled" ${contract.status === 'cancelled' ? 'selected' : ''}>Cancelado</option>
              <option value="renewed" ${contract.status === 'renewed' ? 'selected' : ''}>Renovado</option>

          </div>
        </form>
      </div>
    `;
  },

  // Setup contract form live calculations
  setupContractFormListeners() {
    const serviceSelect = document.getElementById('contract-service');
    const startInput = document.getElementById('contract-start');
    const endInput = document.getElementById('contract-end');
    const sellInput = document.getElementById('contract-sell');
    const costInput = document.getElementById('contract-cost');
    const profitInput = document.getElementById('contract-profit');
    const paidInput = document.getElementById('contract-paid');

    const updateProfit = () => {
      const sell = parseFloat(sellInput.value) || 0;
      const cost = parseFloat(costInput.value) || 0;
      const profit = sell - cost;
      profitInput.value = Utils.formatMoney(profit);
      profitInput.className = `form-input bg-slate-100 dark:bg-slate-800 font-semibold ${profit >= 0 ? 'text-green-600' : 'text-red-600'}`;
    };

    const fillFromService = () => {
      const opt = serviceSelect.selectedOptions[0];
      if (!opt || !opt.value) return;
      const cost = opt.dataset.cost;
      const sell = opt.dataset.sell;
      const days = opt.dataset.days;
      if (cost) costInput.value = cost;
      if (sell) {
        sellInput.value = sell;
        if (paidInput && !paidInput.value) paidInput.value = sell;
      }
      if (days && startInput.value) {
        endInput.value = Utils.calcEndDate(startInput.value, days);
      }
      updateProfit();
    };

    if (serviceSelect) {
      serviceSelect.addEventListener('change', fillFromService);
      // Initial fill if editing or first select
      if (serviceSelect.value) fillFromService();
    }
    if (startInput) {
      startInput.addEventListener('change', () => {
        const opt = serviceSelect?.selectedOptions[0];
        if (opt?.dataset.days) {
          endInput.value = Utils.calcEndDate(startInput.value, opt.dataset.days);
        }
      });
    }
    sellInput?.addEventListener('input', () => {
      updateProfit();
      if (paidInput && document.querySelector('[name="paymentStatus"]')?.value === 'paid') {
        paidInput.value = sellInput.value;
      }
    });
    costInput?.addEventListener('input', updateProfit);
    updateProfit();

    // Quick client button
    const quickBtn = document.getElementById('btn-quick-client');
    if (quickBtn) {
      quickBtn.onclick = () => {
        this.closeModal();
        setTimeout(() => App.openClientModal(null, true), 150);
      };
    }
  },

  // Client detail view
  clientDetail(client) {
    const contracts = DB.getContracts().filter(c => c.clientId === client.id)
      .sort((a, b) => b.startDate.localeCompare(a.startDate));
    const totalSpent = contracts.reduce((s, c) => s + (c.paidAmount || 0), 0);
    const totalProfit = contracts.reduce((s, c) => s + (c.profit || 0), 0);
    const active = contracts.filter(c => c.status === 'active').length;

    const rows = contracts.length ? contracts.map(c => {
      const svc = DB.getService(c.serviceId);
      const days = Utils.daysUntil(c.endDate);
      return `
        <tr class="${c.status === 'active' && days !== null && days <= 5 && days >= 0 ? 'row-expiring' : c.status === 'expired' ? 'row-expired' : ''}">
          <td>
            <div class="flex items-center gap-2">
              <div class="w-2.5 h-2.5 rounded-full" style="background:${svc?.color || '#64748b'}"></div>
              <span class="font-medium">${svc?.name || '—'}</span>
            </div>
          </td>
          <td>${Utils.formatDateShort(c.startDate)}</td>
          <td>
            <div>${Utils.formatDateShort(c.endDate)}</div>
            <div class="text-xs text-slate-500">${Utils.daysUntilLabel(c.endDate)}</div>
          </td>
          <td class="font-medium">${Utils.formatMoney(c.sellPrice)}</td>
          <td class="${c.profit >= 0 ? 'profit-positive' : 'profit-negative'} font-medium">${Utils.formatMoney(c.profit)}</td>
          <td>${Utils.statusBadge(c.status)}</td>
          <td>${Utils.paymentBadge(c.paymentStatus)}</td>
        </tr>
      `;
    }).join('') : `<tr><td colspan="7" class="text-center text-slate-400 py-8">Sin contratos aún</td></tr>`;

    return `
      <div class="modal-box p-6 max-w-3xl">
        <div class="flex items-center justify-between mb-5">
          <div>
            <h3 class="text-lg font-semibold">${client.name}</h3>
            <p class="text-sm text-slate-500">${client.phone || ''} ${client.email ? '· ' + client.email : ''}</p>
          </div>
          <button class="btn-icon btn-ghost" onclick="Components.closeModal()">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        
        <div class="grid grid-cols-3 gap-3 mb-6">
          <div class="card p-3 text-center">
            <div class="text-2xl font-bold text-brand-600">${contracts.length}</div>
            <div class="text-xs text-slate-500">Contratos</div>
          </div>
          <div class="card p-3 text-center">
            <div class="text-2xl font-bold text-green-600">${active}</div>
            <div class="text-xs text-slate-500">Activos</div>
          </div>
          <div class="card p-3 text-center">
            <div class="text-2xl font-bold">${Utils.formatMoney(totalProfit)}</div>
            <div class="text-xs text-slate-500">Tu ganancia</div>
          </div>
        </div>
        
        ${client.notes ? `<p class="text-sm text-slate-600 dark:text-slate-300 mb-4 p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">${client.notes}</p>` : ''}
        
        <h4 class="font-medium mb-3">Historial de contratos</h4>
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Servicio</th>
                <th>Inicio</th>
                <th>Vence</th>
                <th>Pagó</th>
                <th>Ganancia</th>
                <th>Estado</th>
                <th>Pago</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        
        <div class="flex justify-end gap-3 mt-5">
          <button class="btn btn-secondary" onclick="App.openClientModal('${client.id}')">
            <i data-lucide="edit" class="w-4 h-4"></i> Editar
          </button>
          <button class="btn btn-primary" onclick="Components.closeModal(); App.openContractModal(null, '${client.id}')">
            <i data-lucide="plus" class="w-4 h-4"></i> Nueva venta
          </button>
        </div>
      </div>
    `;
  }
};

window.Components = Components;
</script>

  afterClients() {
    const search = document.getElementById('search-clients');
    if (!search) return;
    search.addEventListener('input', Utils.debounce((e) => {
      const q = e.target.value.toLowerCase().trim();
      const clients = DB.getClients().filter(c => 
        c.name.toLowerCase().includes(q) ||
        (c.phone || '').toLowerCase().includes(q) ||
        (c.email || '').toLowerCase().includes(q)
      );
      // Re-render tbody simplified
      const contracts = DB.getContracts();
      const tbody = document.getElementById('clients-tbody');
      if (!clients.length && q) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-slate-400 py-8">No se encontraron clientes</td></tr>`;
        return;
      }
      tbody.innerHTML = clients.map(c => {
        const clientContracts = contracts.filter(ct => ct.clientId === c.id);
        const active = clientContracts.filter(ct => ct.status === 'active').length;
        const totalProfit = clientContracts.reduce((s, ct) => s + (ct.profit || 0), 0);
        const last = clientContracts.sort((a, b) => b.startDate.localeCompare(a.startDate))[0];
        return `
          <tr>
            <td>
              <button class="text-left hover:text-brand-600 transition" onclick="App.viewClient('${c.id}')">
                <div class="font-medium">${c.name}</div>
                <div class="text-xs text-slate-500">${c.phone || c.email || 'Sin contacto'}</div>
              </button>
            </td>
            <td class="text-center"><span class="badge ${active > 0 ? 'badge-green' : 'badge-gray'}">${active} activos</span></td>
            <td class="text-center">${clientContracts.length}</td>
            <td class="font-medium ${totalProfit >= 0 ? 'profit-positive' : 'profit-negative'}">${Utils.formatMoney(totalProfit)}</td>
            <td class="text-sm text-slate-500">${last ? Utils.formatDateShort(last.startDate) : '—'}</td>
            <td>
              <div class="flex items-center gap-1">
                <button class="btn-icon btn-ghost" onclick="App.viewClient('${c.id}')"><i data-lucide="eye" class="w-4 h-4"></i></button>
                <button class="btn-icon btn-ghost" onclick="App.openClientModal('${c.id}')"><i data-lucide="edit" class="w-4 h-4"></i></button>
                <button class="btn-icon btn-ghost text-red-500" onclick="App.deleteClient('${c.id}')"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
      lucide.createIcons();
    }, 250));
  },

  // ========== SERVICES ==========
  services() {
    const services = DB.getServices();
    const contracts = DB.getContracts();
    
    const cards = services.map(s => {
      const used = contracts.filter(c => c.serviceId === s.id).length;
      const profit = contracts.filter(c => c.serviceId === s.id).reduce((sum, c) => sum + (c.profit || 0), 0);
      const margin = s.sellPrice > 0 ? ((s.sellPrice - s.cost) / s.sellPrice * 100).toFixed(0) : 0;
      
      return `
        <div class="card p-5 hover:shadow-md transition group">
          <div class="flex items-start justify-between mb-4">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center text-white font-bold text-sm shadow" style="background:${s.color}">
                ${s.name.slice(0, 2).toUpperCase()}
              </div>
              <div>
                <h3 class="font-semibold">${s.name}</h3>
                ${Utils.categoryBadge(s.category)}
              </div>
            </div>
            <div class="opacity-0 group-hover:opacity-100 transition flex gap-1">
              <button class="btn-icon btn-ghost" onclick="App.openServiceModal('${s.id}')">
                <i data-lucide="edit" class="w-4 h-4"></i>
              </button>
              <button class="btn-icon btn-ghost text-red-500" onclick="App.deleteService('${s.id}')">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          
          ${s.description ? `<p class="text-sm text-slate-500 mb-4 line-clamp-2">${s.description}</p>` : ''}
          
          <div class="grid grid-cols-2 gap-3 text-sm">
            <div class="bg-slate-50 dark:bg-slate-800/50 rounded-lg p-2.5">
              <div class="text-xs text-slate-500">Costo</div>
              <div class="font-semibold">${Utils.formatMoney(s.cost)}</div>
            </div>
            <div class="bg-slate-50 dark:bg-slate-800/50 rounded-lg p-2.5">
              <div class="text-xs text-slate-500">Venta</div>
              <div class="font-semibold">${Utils.formatMoney(s.sellPrice)}</div>
            </div>
            <div class="bg-green-50 dark:bg-green-900/20 rounded-lg p-2.5">
              <div class="text-xs text-slate-500">Ganancia</div>
              <div class="font-semibold text-green-600">${Utils.formatMoney(s.sellPrice - s.cost)} <span class="text-xs">(${margin}%)</span></div>

              <div class="text-xs text-slate-500">Duración</div>

          </div>
          
          <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between text-xs text-slate-500">
            <span>${used} venta${used !== 1 ? 's' : ''}</span>
            <span class="font-medium text-green-600">Total: ${Utils.formatMoney(profit)}</span>
          </div>
        </div>
      `;
