  },

  async renewContract(id) {
    const contract = DB.getContract(id);
    if (!contract) return;
    const client = DB.getClient(contract.clientId);
    const svc = DB.getService(contract.serviceId);
    const ok = await Utils.confirm(
      `¿Renovar el contrato de <strong>${client?.name}</strong> para <strong>${svc?.name}</strong>?`,
      'Renovar contrato'
    );
    if (!ok) return;
    let start = Utils.today();
    if (contract.status === 'active' && contract.endDate >= Utils.today()) start = contract.endDate;
    const days = svc?.durationDays || 30;
    const end = Utils.calcEndDate(start, days);
    DB.updateContract(id, { status: 'renewed' });
    DB.addContract({
      clientId: contract.clientId, serviceId: contract.serviceId,
      startDate: start, endDate: end, sellPrice: contract.sellPrice, cost: contract.cost,
      paymentStatus: 'paid', paidAmount: contract.sellPrice,
      notes: (contract.notes ? contract.notes + ' | ' : '') + 'Renovación'
    });
    Utils.toast('Contrato renovado', 'success');
    this.refresh();
  },

  async deleteContract(id) {
    const ok = await Utils.confirm('¿Eliminar este contrato permanentemente?', 'Eliminar contrato');
    if (!ok) return;
    DB.deleteContract(id);
    Utils.toast('Contrato eliminado', 'success');
    this.refresh();
  },

  markAsPaid(id) {
    const c = DB.getContract(id);
    if (!c) return;
    DB.updateContract(id, { paymentStatus: 'paid', paidAmount: c.sellPrice });
    Utils.toast('Marcado como pagado', 'success');
    this.refresh();
  },

  updateAlertDays() {
    const input = document.getElementById('alert-days-input');
    const days = parseInt(input?.value) || 5;
    DB.updateSettings({ alertDays: days });
    Utils.toast(`Alertas a ${days} días`, 'success');
    this.refresh();
  },

  // ========== DISTRIBUIR APP (1 solo archivo) ==========
  buildDistributableHtml(userFilterIds = null) {
    let users = DB.getUsers();
    if (userFilterIds && userFilterIds.length) {
      const set = new Set(userFilterIds);
      users = users.filter(u => set.has(u.id) || u.username === 'admin');
    }

    const preload = {
      version: 2,
      users: users,
      defaults: DB.getDefaultServices(),
      generatedAt: new Date().toISOString(),
      generatedBy: (DB.getSession() && DB.getSession().username) || 'admin'
    };

    let html = null;

    // 1) Plantilla embebida (base64) — método principal
    if (window.__GESTORPRO_CORE_B64__) {
      try {
        const bin = atob(window.__GESTORPRO_CORE_B64__);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        html = new TextDecoder('utf-8').decode(bytes);
      } catch (e) {
        console.warn('b64 decode failed', e);
      }
    }

    // 2) Fallback: script #gp-source
    if (!html) {
      const srcEl = document.getElementById('gp-source');
      if (srcEl && srcEl.textContent && srcEl.textContent.length > 500) {
        html = srcEl.textContent;
      }
    }

    if (!html) {
      throw new Error('No se pudo armar el archivo. Probá de nuevo o usá exportar JSON.');
    }

    const inject = 'window.__GESTORPRO_PRELOAD__ = ' + JSON.stringify(preload) + ';';
    if (html.indexOf('window.__GESTORPRO_PRELOAD__ = null;') !== -1) {
      html = html.replace('window.__GESTORPRO_PRELOAD__ = null;', inject);
    } else if (html.indexOf('/*__PRELOAD_INJECT__*/') !== -1) {
      html = html.replace('/*__PRELOAD_INJECT__*/', inject);
    } else {
      html = html.replace('<script>', '<script>' + inject, 1);
    }
    return html;
  },


  buildAccessShareMessage({ username, password, name }) {
    const url = (location.href || '').split('#')[0].split('?')[0];
    let brand = 'OvaDigital';
    try { brand = (DB.getSettings && DB.getSettings()?.businessName) || 'OvaDigital'; } catch (e) {}
    return `¡Hola! 👋

Gracias por contratar los servicios de ${brand}.

Tu acceso a GestorPro:
🔗 ${url}
👤 Usuario: ${username}
🔑 Contraseña: ${password}

Abrí el link en Chrome e ingresá con tus datos.
En el menú ⋮ de Chrome podés "Agregar a la pantalla de inicio".

¡Cualquier consulta, escribime!
— ${brand}`;
  },



  async shareAccessMessage(payload) {
    const text = this.buildAccessShareMessage(payload);
    try {
      if (navigator.share) {
        await navigator.share({ title: 'Acceso GestorPro', text });
        Utils.toast('Mensaje listo para enviar', 'success');
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    this.showShareTextModal(text, payload.username);
  },

  showShareTextModal(text, username) {
    Components.openModal(`
      <div class="modal-box p-5 max-w-lg">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-lg font-semibold">Enviar acceso ${username ? '· ' + username : ''}</h3>
          <button type="button" class="btn-icon btn-ghost" onclick="Components.closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <p class="text-sm text-slate-500 mb-2">Copiá o compartí este mensaje por WhatsApp:</p>
        <textarea id="share-access-text" class="input w-full h-48 text-sm font-mono" readonly></textarea>
        <div class="flex flex-col gap-2 mt-3">
          <button type="button" class="btn btn-primary w-full" id="btn-copy-share-text">Copiar mensaje</button>
          <a id="btn-wa-share" class="btn btn-secondary w-full text-center" target="_blank" rel="noopener">Abrir WhatsApp</a>
          <button type="button" class="btn btn-ghost w-full" onclick="Components.closeModal()">Cerrar</button>
        </div>
      </div>
    `);
    const ta = document.getElementById('share-access-text');
    if (ta) ta.value = text;
    const wa = document.getElementById('btn-wa-share');
    if (wa) wa.href = 'https://wa.me/?text=' + encodeURIComponent(text);
    document.getElementById('btn-copy-share-text')?.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(text);
        Utils.toast('Mensaje copiado', 'success');
      } catch (e) {
        ta?.select();
        document.execCommand('copy');
        Utils.toast('Mensaje copiado', 'success');
      }
    });
    if (window.lucide) lucide.createIcons();
  },

  openDistributeModal() {
    if (!DB.isAdmin()) {
      Utils.toast('Solo el administrador puede hacer esto', 'error');
      return;
    }
    const users = DB.getUsers();
    if (!users.length) {
      Utils.toast('No hay usuarios', 'warning');
      return;
    }

    const userOpts = users.map(u => {
      return '<label class="flex items-center gap-3 p-3 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">' +
        '<input type="radio" name="dist-user" value="' + u.id + '" data-username="' + u.username + '" class="accent-sky-500">' +
        '<div class="min-w-0"><div class="font-medium text-sm">' + (u.name || u.username) + '</div>' +
        '<div class="text-xs text-slate-500">@' + u.username + (u.role === 'admin' ? ' · Admin' : '') + '</div></div></label>';
    }).join('');

    Components.openModal(
      '<div class="modal-box p-5 max-w-lg">' +
      '<div class="flex items-center justify-between mb-3">' +
      '<h3 class="text-lg font-semibold">Enviar app a un usuario</h3>' +
      '<button type="button" class="btn-icon btn-ghost" onclick="Components.closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>' +
      '<p class="text-sm text-slate-500 mb-3">Se genera <strong>1 archivo HTML</strong> con el nombre del usuario, listo para WhatsApp.</p>' +
      '<div class="space-y-2 max-h-60 overflow-y-auto mb-3" id="dist-user-list">' + userOpts + '</div>' +
      '<label class="flex items-center gap-2 p-3 rounded-lg border border-dashed border-slate-300 dark:border-slate-600 mb-4 cursor-pointer">' +
      '<input type="radio" name="dist-user" value="__ALL__" data-username="TODOS">' +
      '<div><div class="font-medium text-sm">Todos los usuarios</div><div class="text-xs text-slate-500">Un archivo con todas las cuentas</div></div></label>' +
      '<div class="flex flex-col sm:flex-row gap-2">' +
      '<button type="button" class="btn btn-primary flex-1" id="btn-dist-go"><i data-lucide="share-2" class="w-4 h-4"></i> Generar y compartir</button>' +
      '<button type="button" class="btn btn-secondary" onclick="Components.closeModal()">Cancelar</button></div></div>'
    );
    if (window.lucide) lucide.createIcons();

    const nonAdmin = document.querySelector('#dist-user-list input[name="dist-user"]');
    const pick = [...document.querySelectorAll('input[name="dist-user"]')].find(i => i.dataset.username !== 'admin') || nonAdmin;
    if (pick) pick.checked = true;

    document.getElementById('btn-dist-go').onclick = () => {
      const sel = document.querySelector('input[name="dist-user"]:checked');
      if (!sel) { Utils.toast('Elegí un usuario', 'warning'); return; }
      Components.closeModal();
      const uname = sel.dataset.username || 'usuario';
      if (sel.value === '__ALL__') {
        this.generateDistributableApp(null, 'GestorPro-TODOS.html');
      } else {
        this.generateDistributableApp([sel.value], 'GestorPro-' + uname + '.html');
      }
    };
  },

  async generateDistributableApp(userFilterIds = null, filename = null) {
    if (!DB.isAdmin()) {
      Utils.toast('Solo el administrador', 'error');
      return;
    }

    let html;
    try {
      html = this.buildDistributableHtml(userFilterIds);
    } catch (e) {
      console.error(e);
      Utils.toast((e && e.message) || 'Error al generar el archivo', 'error', 5000);
      return;
    }

    if (!filename) {
      if (userFilterIds && userFilterIds.length === 1) {
        const u = DB.getUserById(userFilterIds[0]);
        filename = 'GestorPro-' + ((u && u.username) || 'usuario') + '.html';
      } else {
        filename = 'GestorPro-TODOS.html';
      }
    }

    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const file = new File([blob], filename, { type: 'text/html' });

    // 1) Compartir nativo (Android WhatsApp)
    try {
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: filename,
          text: 'GestorPro — abrí este archivo en Chrome e ingresá con tu usuario'
        });
        Utils.toast('Compartido: ' + filename, 'success');
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }

    // 2) Descarga
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { try { a.remove(); URL.revokeObjectURL(url); } catch (e) {} }, 2500);
    } catch (e) {
      console.warn(e);
    }

    // 3) Modal de ayuda
    this.showShareHelpModal(blob, filename);
  },

  showShareHelpModal(blob, filename) {
    const url = URL.createObjectURL(blob);
    Components.openModal(
      '<div class="modal-box p-5 max-w-lg">' +
      '<div class="flex items-center justify-between mb-3">' +
      '<h3 class="text-lg font-semibold">Listo: ' + filename + '</h3>' +
      '<button type="button" class="btn-icon btn-ghost" onclick="Components.closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>' +
      '<p class="text-sm text-slate-500 mb-4">Si no se descargó solo, usá una opción:</p>' +
      '<div class="space-y-2">' +
      '<a href="' + url + '" download="' + filename + '" class="btn btn-primary w-full py-3"><i data-lucide="download" class="w-5 h-5"></i> Descargar ' + filename + '</a>' +
      '<a href="' + url + '" target="_blank" rel="noopener" class="btn btn-secondary w-full py-3"><i data-lucide="external-link" class="w-5 h-5"></i> Abrir y luego Compartir (⋮)</a>' +
      '<button type="button" class="btn btn-secondary w-full py-3" id="share-native-btn"><i data-lucide="share-2" class="w-5 h-5"></i> Compartir con WhatsApp</button>' +
      '</div>' +
      '<p class="text-xs text-slate-500 mt-3">La otra persona abre el HTML en Chrome e ingresa con su usuario y contraseña.</p></div>'
    );
    if (window.lucide) lucide.createIcons();
    document.getElementById('share-native-btn')?.addEventListener('click', async () => {
      const file = new File([blob], filename, { type: 'text/html' });
      try {
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
        } else if (navigator.share) {
          await navigator.share({ title: filename, url: url });
        } else {
          Utils.toast('Usá Descargar', 'warning');
        }
      } catch (e) {
        if (e.name !== 'AbortError') Utils.toast('No se pudo compartir', 'error');
      }
    });
  },

  exportUsersPack() {
    if (!DB.isAdmin()) return;
    const pack = {
      type: 'gestorpro_full_system',
      version: 2,
      users: DB.getUsers(),
      data: {},
      defaults: DB.getDefaultServices(),
      exportedAt: new Date().toISOString()
    };
    DB.getUsers().forEach(u => {
      pack.data[u.id] = {
        clients: [],
        services: JSON.parse(JSON.stringify(DB.getDefaultServices())),
        contracts: [],
        settings: { currency: 'USD', currencySymbol: '$', businessName: 'Mi Negocio', alertDays: 5 },
        meta: { version: 2, userId: u.id }
      };
    });
    const json = JSON.stringify(pack, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const filename = 'GestorPro-usuarios.json';
    const file = new File([blob], filename, { type: 'application/json' });
    (async () => {
      try {
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Usuarios GestorPro' });
          Utils.toast('JSON compartido', 'success');
          return;
        }
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
      Utils.toast('JSON exportado', 'success');
    })();
  },

  // ========== EXPORT / IMPORT ==========
  exportData() {
    const isAdmin = DB.isAdmin();
    let data, filename;
    if (isAdmin && confirm('¿Exportar TODO el sistema (todos los usuarios)?\n\nAceptar = sistema completo\nCancelar = solo tus datos actuales')) {
      data = DB.exportFullSystem();
      filename = `gestorpro_SISTEMA_${Utils.today()}.json`;
    } else {
      data = DB.exportUserJSON();
      const session = DB.getSession();
      filename = `gestorpro_${session?.username || 'user'}_${Utils.today()}.json`;
    }
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    Utils.toast('Datos exportados', 'success');
  },

  importData(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const result = DB.importJSON(ev.target.result);
      if (result.error) Utils.toast('Error: ' + result.error, 'error');
      else {
        Utils.toast(result.type === 'full' ? 'Sistema completo importado' : 'Datos importados', 'success');
        if (result.type === 'full') {
          DB.clearSession();
          this.showLogin();
        } else {
          this.refresh();
        }
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }
};

window.App = App;
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
  <script>/**
 * GestorPro Cloud Bridge — un solo URL, usuarios compartidos en el servidor
 */
(function () {
  if (!window.__GESTORPRO_CLOUD__) return;

  const API = (window.__GESTORPRO_API__ || "").replace(/\/$/, "");

  function apiUrl(path) {
    return API + path;
  }

  async function api(path, opts) {
    opts = opts || {};
    const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    const token = localStorage.getItem("gestorpro_cloud_token");
    if (token) headers["X-Session-Token"] = token;
    const res = await fetch(apiUrl(path), {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
    });
    let data = {};
    try {
      data = await res.json();
    } catch (e) {}
    if (!res.ok) {
      const err = new Error((data && data.error) || "Error " + res.status);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  DB._cloudCache = null;
  DB._cloudUsersCache = [];
  DB._cloudDefaults = [];
  DB._saveTimer = null;

  DB.getSession = function () {
    try {
      const raw = localStorage.getItem("gestorpro_cloud_session");
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  };

  DB.setSession = function (user, impersonating) {
    // Compatible con App.impersonateUser(setSession(adminUser, userId))
    // y login setSession(user, token) cuando token es string largo
    const prev = DB.getSession() || {};
    let token = localStorage.getItem("gestorpro_cloud_token") || prev.token;
    let imp = prev.impersonating || null;

    if (typeof impersonating === "string") {
      if (impersonating.length > 40 || impersonating.indexOf("-") !== -1 && impersonating.length > 20) {
        // parece token
        token = impersonating;
        imp = null;
      } else if (impersonating === "" || impersonating === null) {
        imp = null;
      } else {
        // userId a impersonar
        imp = impersonating;
      }
    } else if (impersonating === null || impersonating === undefined) {
      // keep or clear
      if (arguments.length >= 2) imp = null;
    }

    const session = {
      userId: user.id || user.userId,
      username: user.username,
      name: user.name || user.username,
      role: user.role || "user",
      token: token,
      loginAt: new Date().toISOString(),
    };
    if (imp) session.impersonating = imp;
    localStorage.setItem("gestorpro_cloud_session", JSON.stringify(session));
    if (token) localStorage.setItem("gestorpro_cloud_token", token);
  };

  DB.clearSession = function () {
    const token = localStorage.getItem("gestorpro_cloud_token");
    localStorage.removeItem("gestorpro_cloud_session");
    localStorage.removeItem("gestorpro_cloud_token");
    DB._cloudCache = null;
    if (token) api("/api/logout", { method: "POST" }).catch(function () {});
  };

  DB.currentUserId = function () {
    const s = DB.getSession();
    if (!s) return null;
    return s.impersonating || s.userId;
  };

  DB.isAdmin = function () {
    const s = DB.getSession();
    return !!(s && s.role === "admin" && !s.impersonating);
  };

  DB._cloudPull = async function () {
    const session = DB.getSession();
    if (!session) return null;
    let path = "/api/data";
    if (session.impersonating) path += "?userId=" + encodeURIComponent(session.impersonating);
    const data = await api(path);
    DB._cloudCache = data.data;
    return DB._cloudCache;
  };

  DB._cloudPush = async function () {
    if (!DB._cloudCache) return;
    const session = DB.getSession();
    if (!session) return;
    let path = "/api/data";
    if (session.impersonating) path += "?userId=" + encodeURIComponent(session.impersonating);
    await api(path, { method: "PUT", body: DB._cloudCache });
  };

  DB._cloudScheduleSave = function () {
    clearTimeout(DB._saveTimer);
    DB._saveTimer = setTimeout(function () {
      DB._cloudPush().catch(function (e) {
        console.error(e);
        if (window.Utils) Utils.toast("Error al guardar en la nube", "error");
      });
    }, 300);
  };

  DB.getData = function () {
    if (!DB._cloudCache) {
      DB._cloudCache = {
        clients: [],
        services: [],
        contracts: [],
        settings: { currency: "USD", currencySymbol: "$", businessName: "Mi Negocio", alertDays: 5 },
        meta: {},
      };
    }
    return DB._cloudCache;
  };

  DB.saveData = function (data) {
    DB._cloudCache = data;
    DB._cloudScheduleSave();
  };

  DB.getUsers = function () {
    return DB._cloudUsersCache || [];
  };

  DB.getUserById = function (id) {
    return (DB._cloudUsersCache || []).find(function (u) {
      return u.id === id;
    });
  };

  DB.getUserByUsername = function (username) {
    const u = (username || "").toLowerCase();
    return (DB._cloudUsersCache || []).find(function (x) {
      return (x.username || "").toLowerCase() === u;
    });
  };

  DB._cloudLoadUsers = async function () {
    const data = await api("/api/users");
    DB._cloudUsersCache = data.users || [];
    return DB._cloudUsersCache;
  };

  DB._cloudLogin = async function (username, password) {
    if (!username || !password) {
      throw new Error("Completá usuario y contraseña");
    }
    let data;
    try {
      data = await api("/api/login", {
        method: "POST",
        body: { username: username, password: password },
      });
    } catch (e) {
      if (e.status === 401) throw new Error("Usuario o contraseña incorrectos");
      if (e.status === 403) throw new Error("Usuario desactivado");
      throw new Error(e.message || "Error de conexión con el servidor");
    }
    if (!data || !data.token) throw new Error("Respuesta inválida del servidor");
    localStorage.setItem("gestorpro_cloud_token", data.token);
    DB.setSession(data.user, data.token);
    try {
      await DB._cloudPull();
    } catch (e) {
      console.warn("pull after login", e);
    }
    if (data.user.role === "admin") {
      try {
        await DB._cloudLoadUsers();
        const defs = await api("/api/defaults");
        DB._cloudDefaults = defs.defaults || [];
      } catch (e) {}
    }
    return { user: data.user };
  };

  DB.createUser = function (opts) {
    // sync stub — App must use async path; we monkey-patch form
    return { _cloudNeedAsync: true, opts: opts };
  };

  DB.updateUser = function (id, updates) {
    return { _cloudNeedAsync: true, id: id, updates: updates };
  };

  DB.deleteUser = function (id) {
    return { _cloudNeedAsync: true, id: id };
  };

  DB.resetUserData = function (id) {
    return { _cloudNeedAsync: true, id: id };
  };

  DB.getDefaultServices = function () {
    return DB._cloudDefaults && DB._cloudDefaults.length
      ? DB._cloudDefaults
      : DB.DEFAULT_SERVICES || [];
  };

  DB.setDefaultServices = function (services) {
    DB._cloudDefaults = services;
    api("/api/defaults", { method: "PUT", body: services }).catch(console.error);
  };

  function patchApp() {
    if (!window.App || window.__GESTORPRO_CLOUD_PATCHED__) return !!window.App;

    // Login (siempre re-enlaza el form cloud)
    const _showLogin = App.showLogin.bind(App);
    App.showLogin = function () {
      _showLogin();
      const form = document.getElementById("login-form");
      if (!form) return;

      // Toggle ver contraseña (por si el bridge corre después)
      const passInput = document.getElementById("login-pass");
      const toggleBtn = document.getElementById("toggle-pass");
      if (toggleBtn && passInput && !toggleBtn._bound) {
        toggleBtn._bound = true;
        toggleBtn.onclick = function () {
          const show = passInput.type === "password";
          passInput.type = show ? "text" : "password";
          toggleBtn.textContent = show ? "🙈" : "👁️";
        };
      }

      form.onsubmit = async function (e) {
        e.preventDefault();
        const errEl = document.getElementById("login-error");
        const btn = document.getElementById("login-submit");
        const username = (document.getElementById("login-user") || {}).value || "";
        const password = (document.getElementById("login-pass") || {}).value || "";
        try {
          if (errEl) {
            errEl.style.display = "none";
            errEl.textContent = "";
          }
          if (btn) {
            btn.disabled = true;
            btn.textContent = "Entrando…";
          }
          await DB._cloudLogin(username.trim(), password);
          await App.showApp();
        } catch (err) {
          console.error("login", err);
          const msg =
            (err && err.message) ||
            "No se pudo iniciar sesión. Revisá usuario/contraseña o esperá 1 min (servidor free).";
          if (errEl) {
            errEl.style.display = "block";
            errEl.textContent = msg;
          } else {
            alert(msg);
          }
        } finally {
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Entrar";
          }
        }
      };
    };

    const _showApp = App.showApp.bind(App);
    App.showApp = async function () {
      try {
        if (DB.getSession()) {
          await DB._cloudPull();
          if (DB.getSession().role === "admin") {
            try {
              await DB._cloudLoadUsers();
              const defs = await api("/api/defaults");
              DB._cloudDefaults = defs.defaults || [];
            } catch (e) {}
          }
        }
      } catch (e) {
        if (e.status === 401) {
          DB.clearSession();
          App.showLogin();
          return;
        }
      }
      try { if (window.Notify && Notify.unlockAudio) Notify.unlockAudio(); } catch (e) {}
      try {
        document.body.addEventListener('click', function () {
          try { if (window.Notify && Notify.unlockAudio) Notify.unlockAudio(); } catch (e2) {}
        }, { once: false, passive: true });
      } catch (e) {}
      return _showApp();
    };

    // openUserModal: manejado en App.openUserModal (cloud + local)

    App.deleteUser = async function (id) {
      const user = DB.getUserById(id);
      if (!user) return;
      const ok = await Utils.confirm(
        '¿Eliminar al usuario "' + user.username + '"?',
        "Eliminar usuario"
      );
      if (!ok) return;
      try {
        await api("/api/users/" + encodeURIComponent(id), { method: "DELETE" });
        await DB._cloudLoadUsers();
        Utils.toast("Usuario eliminado", "success");
        App.refresh();
      } catch (e) {
        Utils.toast(e.message, "error");
      }
    };

    App.resetUserData = async function (id) {
      const ok = await Utils.confirm("¿Resetear todos los datos de este usuario?", "Reset");
      if (!ok) return;
      try {
        await api("/api/users/" + encodeURIComponent(id) + "/reset", { method: "POST" });
        Utils.toast("Datos reseteados", "success");
        App.refresh();
      } catch (e) {
        Utils.toast(e.message, "error");
      }
    };

    App.impersonateUser = async function (userId) {
      const session = DB.getSession();
      if (!session || session.role !== "admin") return;
      const user = DB.getUserById(userId);
      if (!user) return;
      session.impersonating = userId;
      localStorage.setItem("gestorpro_cloud_session", JSON.stringify(session));
      try {
        await DB._cloudPull();
        Utils.toast("Viendo datos de " + user.username, "info");
        App.navigate("dashboard");
      } catch (e) {
        Utils.toast(e.message, "error");
      }
    };

    App.stopImpersonate = async function () {
      const session = DB.getSession();
      if (!session) return;
      delete session.impersonating;
      localStorage.setItem("gestorpro_cloud_session", JSON.stringify(session));
      try {
        await DB._cloudPull();
        Utils.toast("Volviste al panel admin", "success");
        App.navigate("admin");
      } catch (e) {
        Utils.toast(e.message, "error");
      }
    };

    App.openDistributeModal = function () {
      const url = location.href.split("#")[0].split("?")[0];
      const users = (DB.getUsers() || []).filter(function (u) {
        return u.username !== "admin";
      });
      const opts = users
        .map(function (u) {
          return (
            '<option value="' +
            u.id +
            '" data-username="' +
            u.username +
            '" data-name="' +
            (u.name || u.username).replace(/"/g, "") +
            '">' +
            (u.name || u.username) +
            " (@" +
            u.username +
            ")</option>"
          );
        })
        .join("");
      Components.openModal(
        '<div class="modal-box p-5 max-w-lg">' +
          '<div class="flex items-center justify-between mb-3">' +
          '<h3 class="text-lg font-semibold">Compartir acceso</h3>' +
          '<button type="button" class="btn-icon btn-ghost" onclick="Components.closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>' +
          '<p class="text-sm text-slate-500 mb-3">Mensaje listo con <strong>link</strong>, usuario y saludo de <strong>OvaDigital</strong>.</p>' +
          '<label class="text-xs font-medium text-slate-500">Usuario</label>' +
          '<select id="share-user-select" class="input w-full mb-2">' +
          '<option value="">— Elegir usuario —</option>' +
          opts +
          "</select>" +
          '<label class="text-xs font-medium text-slate-500">Contraseña (la que le diste)</label>' +
          '<input id="share-user-pass" type="text" class="input w-full mb-2" placeholder="Contraseña del usuario" />' +
          '<label class="text-xs font-medium text-slate-500">Nombre del negocio en el saludo</label>' +
          '<input id="share-brand" type="text" class="input w-full mb-3" value="OvaDigital" />' +
          '<button type="button" class="btn btn-primary w-full" id="btn-share-access-go">Generar mensaje para WhatsApp</button>' +
          '<button type="button" class="btn btn-secondary w-full mt-2" id="btn-copy-only-url">Solo copiar link</button>' +
          '<button type="button" class="btn btn-ghost w-full mt-2" onclick="Components.closeModal()">Cerrar</button></div>'
      );
      if (window.lucide) lucide.createIcons();
      document.getElementById("btn-copy-only-url")?.addEventListener("click", function () {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(function () {
            Utils.toast("Link copiado", "success");
          });
        } else prompt("Link:", url);
      });
      document.getElementById("btn-share-access-go")?.addEventListener("click", function () {
        const sel = document.getElementById("share-user-select");
        const pass = (document.getElementById("share-user-pass") || {}).value || "";
        const brand = (document.getElementById("share-brand") || {}).value || "OvaDigital";
        if (!sel || !sel.value) {
          Utils.toast("Elegí un usuario", "warning");
          return;
        }
        if (!pass) {
          Utils.toast("Escribí la contraseña que le asignaste", "warning");
          return;
        }
        const opt = sel.options[sel.selectedIndex];
        const username = opt.getAttribute("data-username");
        const name = opt.getAttribute("data-name");
        const text =
          "¡Hola! 👋\n\n" +
          "Gracias por contratar los servicios de " +
          brand +
          ".\n\n" +
          "Tu acceso a GestorPro:\n" +
          "🔗 " +
          url +
          "\n" +
          "👤 Usuario: " +
          username +
          "\n" +
          "🔑 Contraseña: " +
          pass +
          "\n\n" +
          "Abrí el link en Chrome e ingresá con tus datos.\n" +
          "¡Cualquier consulta, escribime!";
        Components.closeModal();
        if (App.showShareTextModal) {
          App.showShareTextModal(text, username);
        } else if (App.shareAccessMessage) {
          App.shareAccessMessage({ username: username, password: pass, name: name });
        }
      });
    };

    // Replace admin page button text sense via toast on first admin visit
    window.__GESTORPRO_CLOUD_PATCHED__ = true;
    console.log("[GestorPro] Modo NUBE activo");
    return true;
  }

  function boot() {
    patchApp();
    // Re-aplicar login cloud (App.init pudo haber pintado el form local antes)
    try {
      if (typeof App !== "undefined" && App.showLogin) {
        const hasSession = !!(DB.getSession && DB.getSession());
        if (!hasSession) App.showLogin();
      }
    } catch (e) {
      console.warn(e);
    }
    setTimeout(patchApp, 50);
    setTimeout(function () {
      patchApp();
      try {
        if (!DB.getSession()) App.showLogin();
      } catch (e) {}
    }, 300);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
