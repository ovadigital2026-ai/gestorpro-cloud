    return `
      <div class="space-y-4">
        <div class="flex flex-col sm:flex-row gap-3 justify-between items-start sm:items-center">
          <p class="text-sm text-slate-500">Catálogo de servicios que vendes (perfiles, internet, etc.)</p>
          <button class="btn btn-primary" onclick="App.openServiceModal()">
            <i data-lucide="plus" class="w-4 h-4"></i> Nuevo servicio
          </button>
        </div>
        
        ${services.length === 0 ? `
          <div class="card empty-state py-16">
            <i data-lucide="package" class="w-12 h-12 mb-3 opacity-50"></i>
            <p class="font-medium mb-1">No hay servicios</p>
            <p class="text-sm mb-4">Agrega Netflix, Disney, Internet, etc.</p>
            <button class="btn btn-primary" onclick="App.openServiceModal()">Agregar servicio</button>
          </div>
        ` : `
          <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
            ${cards}
          </div>
        `}
      </div>
    `;
  },

  // ========== CONTRACTS ==========
  contracts() {
    const contracts = DB.getContracts().sort((a, b) => b.startDate.localeCompare(a.startDate) || b.createdAt.localeCompare(a.createdAt));
    
    const rows = contracts.length ? contracts.map(c => {
      const client = DB.getClient(c.clientId);
      const svc = DB.getService(c.serviceId);
      const days = Utils.daysUntil(c.endDate);
      const rowClass = c.status === 'active' && days !== null && days <= 5 && days >= 0 ? 'row-expiring' : 
                       c.status === 'expired' ? 'row-expired' : '';
      
      return `
        <tr class="${rowClass}">
          <td>
            <button class="text-left hover:text-brand-600" onclick="App.viewClient('${c.clientId}')">
              <div class="font-medium">${client?.name || '—'}</div>
            </button>
          </td>
          <td>
            <div class="flex items-center gap-2">
              <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${svc?.color || '#64748b'}"></div>
              <span>${svc?.name || '—'}</span>
            </div>
          </td>
          <td class="text-sm">${Utils.formatDateShort(c.startDate)}</td>
          <td>
            <div class="text-sm">${Utils.formatDateShort(c.endDate)}</div>
            <div class="text-xs ${days !== null && days <= 5 && days >= 0 ? 'text-amber-600 font-medium' : days < 0 ? 'text-red-500' : 'text-slate-500'}">${Utils.daysUntilLabel(c.endDate)}</div>
          </td>
          <td class="font-medium">${Utils.formatMoney(c.sellPrice)}</td>
          <td class="text-sm text-slate-500">${Utils.formatMoney(c.cost)}</td>
          <td class="font-semibold ${c.profit >= 0 ? 'profit-positive' : 'profit-negative'}">${Utils.formatMoney(c.profit)}</td>
          <td>${Utils.statusBadge(c.status)}</td>
          <td>${Utils.paymentBadge(c.paymentStatus)}</td>
          <td>
            <div class="flex items-center gap-1">
              <button class="btn-icon btn-ghost" title="Editar / Renovar" onclick="App.openContractModal('${c.id}')">
                <i data-lucide="edit" class="w-4 h-4"></i>
              </button>
              <button class="btn-icon btn-ghost text-green-600" title="Renovar" onclick="App.renewContract('${c.id}')">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
              </button>
              <button class="btn-icon btn-ghost text-red-500" title="Eliminar" onclick="App.deleteContract('${c.id}')">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    }).join('') : `
      <tr>
        <td colspan="10">
          <div class="empty-state">
            <i data-lucide="file-text" class="w-12 h-12 mb-3 opacity-50"></i>
            <p class="font-medium mb-1">No hay contratos registrados</p>
            <p class="text-sm mb-4">Registra tu primera venta de perfil o servicio</p>
            <button class="btn btn-primary" onclick="App.openContractModal()">
              <i data-lucide="plus" class="w-4 h-4"></i> Nueva venta
            </button>
          </div>
        </td>
      </tr>
    `;

    return `
      <div class="space-y-4">
        <div class="flex flex-col sm:flex-row gap-3 justify-between">
          <div class="flex flex-wrap gap-2">
            <div class="search-box flex-1 min-w-[200px]">
              <i data-lucide="search" class="w-4 h-4 search-icon"></i>
              <input type="text" id="search-contracts" class="form-input" placeholder="Buscar cliente o servicio...">
            </div>
            <select id="filter-status" class="form-select w-auto">
              <option value="">Todos los estados</option>
              <option value="active">Activos</option>
              <option value="expired">Vencidos</option>
              <option value="cancelled">Cancelados</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="App.openContractModal()">
            <i data-lucide="plus" class="w-4 h-4"></i> Nueva venta
          </button>
        </div>
        
        <div class="card overflow-hidden">
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Cliente</th>
                  <th>Servicio</th>
                  <th>Inicio</th>
                  <th>Vence</th>
                  <th>Venta</th>
                  <th>Costo</th>
                  <th>Ganancia</th>
                  <th>Estado</th>
                  <th>Pago</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="contracts-tbody">${rows}</tbody>
            </table>
          </div>
        </div>
      </div>
    `;
  },

  afterContracts() {
    const search = document.getElementById('search-contracts');
    const filter = document.getElementById('filter-status');
    
    const applyFilters = () => {
      const q = (search?.value || '').toLowerCase().trim();
      const status = filter?.value || '';
      let contracts = DB.getContracts().sort((a, b) => b.startDate.localeCompare(a.startDate));
      
      if (status) contracts = contracts.filter(c => c.status === status);
      if (q) {
        contracts = contracts.filter(c => {
          const client = DB.getClient(c.clientId);
          const svc = DB.getService(c.serviceId);
          return (client?.name || '').toLowerCase().includes(q) ||
                 (svc?.name || '').toLowerCase().includes(q) ||
                 (c.notes || '').toLowerCase().includes(q);
        });
      }
      
      const tbody = document.getElementById('contracts-tbody');
      if (!contracts.length) {
        tbody.innerHTML = `<tr><td colspan="10" class="text-center text-slate-400 py-8">No se encontraron contratos</td></tr>`;
        return;
      }
      
      tbody.innerHTML = contracts.map(c => {
        const client = DB.getClient(c.clientId);
        const svc = DB.getService(c.serviceId);
        const days = Utils.daysUntil(c.endDate);
        const rowClass = c.status === 'active' && days !== null && days <= 5 && days >= 0 ? 'row-expiring' : 
                         c.status === 'expired' ? 'row-expired' : '';
        return `
          <tr class="${rowClass}">
            <td><button class="text-left hover:text-brand-600" onclick="App.viewClient('${c.clientId}')"><div class="font-medium">${client?.name || '—'}</div></button></td>
            <td><div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full" style="background:${svc?.color || '#64748b'}"></div><span>${svc?.name || '—'}</span></div></td>
            <td class="text-sm">${Utils.formatDateShort(c.startDate)}</td>
            <td><div class="text-sm">${Utils.formatDateShort(c.endDate)}</div><div class="text-xs ${days !== null && days <= 5 && days >= 0 ? 'text-amber-600 font-medium' : days < 0 ? 'text-red-500' : 'text-slate-500'}">${Utils.daysUntilLabel(c.endDate)}</div></td>
            <td class="font-medium">${Utils.formatMoney(c.sellPrice)}</td>
            <td class="text-sm text-slate-500">${Utils.formatMoney(c.cost)}</td>
            <td class="font-semibold ${c.profit >= 0 ? 'profit-positive' : 'profit-negative'}">${Utils.formatMoney(c.profit)}</td>
            <td>${Utils.statusBadge(c.status)}</td>
            <td>${Utils.paymentBadge(c.paymentStatus)}</td>
            <td>
              <div class="flex items-center gap-1">
                <button class="btn-icon btn-ghost" onclick="App.openContractModal('${c.id}')"><i data-lucide="edit" class="w-4 h-4"></i></button>
                <button class="btn-icon btn-ghost text-green-600" onclick="App.renewContract('${c.id}')"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
                <button class="btn-icon btn-ghost text-red-500" onclick="App.deleteContract('${c.id}')"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
      lucide.createIcons();
    };
    
    search?.addEventListener('input', Utils.debounce(applyFilters, 250));
    filter?.addEventListener('change', applyFilters);
  },

  // ========== REPORTS ==========
  reports() {
    const stats = DB.getStats();
    const services = DB.getServices();
    const contracts = DB.getContracts();
    
    // Profit by service
    const byServiceRows = Object.entries(stats.byService)
      .map(([id, data]) => {
        const svc = services.find(s => s.id === id);
        return { id, name: svc?.name || 'Desconocido', color: svc?.color, ...data };
      })
      .sort((a, b) => b.profit - a.profit);

    const serviceTable = byServiceRows.length ? byServiceRows.map(s => `
      <tr>
        <td>
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full" style="background:${s.color || '#64748b'}"></div>
            ${s.name}
          </div>
        </td>
        <td class="text-center">${s.count}</td>
        <td>${Utils.formatMoney(s.revenue)}</td>
        <td>${Utils.formatMoney(s.cost)}</td>
        <td class="font-semibold ${s.profit >= 0 ? 'profit-positive' : 'profit-negative'}">${Utils.formatMoney(s.profit)}</td>
        <td class="text-sm text-slate-500">${s.revenue > 0 ? ((s.profit / s.revenue) * 100).toFixed(1) : 0}%</td>
      </tr>
    `).join('') : `<tr><td colspan="6" class="text-center text-slate-400 py-6">Sin datos</td></tr>`;

    // Top clients
    const clientProfits = {};
    contracts.forEach(c => {
      if (!clientProfits[c.clientId]) clientProfits[c.clientId] = { profit: 0, count: 0, spent: 0 };
      clientProfits[c.clientId].profit += c.profit || 0;
      clientProfits[c.clientId].count++;
      clientProfits[c.clientId].spent += c.paidAmount || 0;
    });
    
    const topClients = Object.entries(clientProfits)
      .map(([id, d]) => ({ id, name: DB.getClient(id)?.name || '—', ...d }))
      .sort((a, b) => b.profit - a.profit)
      .slice(0, 10);

    const clientsTable = topClients.length ? topClients.map((c, i) => `
      <tr>
        <td class="text-slate-400 font-medium">#${i + 1}</td>
        <td class="font-medium">${c.name}</td>
        <td class="text-center">${c.count}</td>
        <td>${Utils.formatMoney(c.spent)}</td>
        <td class="font-semibold profit-positive">${Utils.formatMoney(c.profit)}</td>
      </tr>
    `).join('') : `<tr><td colspan="5" class="text-center text-slate-400 py-6">Sin datos</td></tr>`;

    return `
      <div class="space-y-6">
        <!-- Summary -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="card p-4">
            <div class="text-sm text-slate-500 mb-1">Ingresos totales</div>
            <div class="text-xl font-bold">${Utils.formatMoney(stats.totalRevenue)}</div>
          </div>
          <div class="card p-4">
            <div class="text-sm text-slate-500 mb-1">Costos totales</div>
            <div class="text-xl font-bold text-red-500">${Utils.formatMoney(stats.totalCost)}</div>
          </div>
          <div class="card p-4">
            <div class="text-sm text-slate-500 mb-1">Ganancia neta</div>
            <div class="text-xl font-bold text-green-600">${Utils.formatMoney(stats.totalProfit)}</div>
          </div>
          <div class="card p-4">
            <div class="text-sm text-slate-500 mb-1">Margen promedio</div>
            <div class="text-xl font-bold">${stats.totalRevenue > 0 ? ((stats.totalProfit / stats.totalRevenue) * 100).toFixed(1) : 0}%</div>
          </div>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- By service -->
          <div class="card p-5">
            <h3 class="font-semibold mb-4 flex items-center gap-2">
              <i data-lucide="pie-chart" class="w-5 h-5 text-brand-500"></i>
              Ganancia por servicio
            </h3>
            <div class="chart-container mb-4" style="height:220px">
              <canvas id="chart-services"></canvas>
            </div>
            <div class="table-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Servicio</th>
                    <th class="text-center">#</th>
                    <th>Ingresos</th>
                    <th>Costo</th>
                    <th>Ganancia</th>
                    <th>Margen</th>
                  </tr>
                </thead>
                <tbody>${serviceTable}</tbody>
              </table>
            </div>
          </div>
          
          <!-- Top clients -->
          <div class="card p-5">
            <h3 class="font-semibold mb-4 flex items-center gap-2">
              <i data-lucide="trophy" class="w-5 h-5 text-amber-500"></i>
              Top clientes (por ganancia)
            </h3>
            <div class="table-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Cliente</th>
                    <th class="text-center">Compras</th>
                    <th>Gastó</th>
                    <th>Tu ganancia</th>
                  </tr>
                </thead>
                <tbody>${clientsTable}</tbody>
              </table>
            </div>
          </div>
        </div>
        
        <!-- Monthly chart -->
        <div class="card p-5">
          <h3 class="font-semibold mb-4">Evolución mensual</h3>
          <div class="chart-container">
            <canvas id="chart-report-monthly"></canvas>
          </div>
        </div>
      </div>
    `;
  },

  afterReports() {
    const isDark = document.documentElement.classList.contains('dark');
    const stats = DB.getStats();
    const services = DB.getServices();
    
    // Service pie
    const byService = Object.entries(stats.byService)
      .map(([id, d]) => ({ name: services.find(s => s.id === id)?.name || '?', profit: d.profit, color: services.find(s => s.id === id)?.color }))
      .filter(s => s.profit > 0)
      .sort((a, b) => b.profit - a.profit)
      .slice(0, 8);
    
    const pieCtx = document.getElementById('chart-services');
    if (pieCtx && window.Chart) {
      if (window._chartServices) window._chartServices.destroy();
      window._chartServices = new Chart(pieCtx, {
        type: 'doughnut',
        data: {
          labels: byService.map(s => s.name),
          datasets: [{
            data: byService.map(s => s.profit),
            backgroundColor: byService.map(s => s.color || '#64748b'),
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: { color: isDark ? '#94a3b8' : '#64748b', boxWidth: 12, padding: 10, font: { size: 11 } }
            }
          }
        }
      });
    }
    
    // Monthly
    const monthlyCtx = document.getElementById('chart-report-monthly');
    if (monthlyCtx && window.Chart) {
      if (window._chartReportMonthly) window._chartReportMonthly.destroy();
      window._chartReportMonthly = new Chart(monthlyCtx, {
        type: 'line',
        data: {
          labels: Utils.getMonthLabels(6),
          datasets: [
            {
              label: 'Ingresos',
              data: Utils.getMonthlyRevenue(6),
              borderColor: '#0ea5e9',
              backgroundColor: 'rgba(14,165,233,0.1)',
              fill: true,
              tension: 0.3
            },
            {
              label: 'Ganancia',
              data: Utils.getMonthlyProfit(6),
              borderColor: '#22c55e',
              backgroundColor: 'rgba(34,197,94,0.1)',
              fill: true,
              tension: 0.3
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: isDark ? '#94a3b8' : '#64748b' } }
          },
          scales: {
            x: { ticks: { color: isDark ? '#94a3b8' : '#64748b' }, grid: { display: false } },
            y: { 
              ticks: { color: isDark ? '#94a3b8' : '#64748b', callback: v => '$' + v },
              grid: { color: isDark ? 'rgba(51,65,85,0.5)' : 'rgba(226,232,240,0.8)' }
            }
          }
        }
      });
    }
  },

  // ========== ALERTS ==========
  alerts() {
    DB.refreshStatuses();
    const stats = DB.getStats();
    const settings = stats.settings;
    const today = Utils.today();
    
    const expiring = stats.expiringList.sort((a, b) => a.endDate.localeCompare(b.endDate));
    const expired = DB.getContracts().filter(c => c.status === 'expired').sort((a, b) => b.endDate.localeCompare(a.endDate));
    const pending = DB.getContracts().filter(c => c.paymentStatus === 'pending' || c.paymentStatus === 'partial');

    const makeCard = (c, type) => {
      const client = DB.getClient(c.clientId);
      const svc = DB.getService(c.serviceId);
      const days = Utils.daysUntil(c.endDate);
      return `
        <div class="card p-4 flex flex-col sm:flex-row sm:items-center gap-4">
          <div class="flex items-center gap-3 flex-1">
            <div class="w-12 h-12 rounded-xl flex items-center justify-center text-white font-bold text-sm shrink-0" style="background:${svc?.color || '#64748b'}">
              ${(svc?.name || '??').slice(0, 2).toUpperCase()}
            </div>
            <div class="min-w-0">
              <div class="font-medium">${client?.name || 'Cliente'} · ${svc?.name || 'Servicio'}</div>
              <div class="text-sm text-slate-500">
                ${type === 'expiring' ? Utils.daysUntilLabel(c.endDate) : type === 'expired' ? `Venció el ${Utils.formatDate(c.endDate)}` : 'Pago pendiente'}
                ${c.notes ? ' · ' + c.notes.slice(0, 40) : ''}
              </div>
              <div class="text-xs text-slate-400 mt-0.5">
                ${Utils.formatMoney(c.sellPrice)} · Ganancia: ${Utils.formatMoney(c.profit)}
              </div>
            </div>
          </div>
          <div class="flex gap-2 shrink-0">
            ${type !== 'pending' ? `
              <button class="btn btn-sm btn-primary" onclick="App.renewContract('${c.id}')">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Renovar
              </button>
            ` : `
              <button class="btn btn-sm btn-primary" onclick="App.markAsPaid('${c.id}')">
                <i data-lucide="check" class="w-3.5 h-3.5"></i> Marcar pagado
              </button>
            `}
            <button class="btn btn-sm btn-secondary" onclick="App.openContractModal('${c.id}')">
              <i data-lucide="edit" class="w-3.5 h-3.5"></i>
            </button>
            ${client?.phone ? `
              <a href="https://wa.me/${client.phone.replace(/\D/g, '')}" target="_blank" class="btn btn-sm btn-secondary" title="WhatsApp">
                <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
              </a>
            ` : ''}
          </div>
        </div>
      `;
    };

    return `
      <div class="space-y-6">
        <!-- Notificaciones del sistema -->
        <div class="card p-4 border border-brand-200 dark:border-brand-800 bg-brand-50/40 dark:bg-brand-950/20">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-brand-500/15 flex items-center justify-center shrink-0">
              <i data-lucide="bell-ring" class="w-5 h-5 text-brand-600"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-semibold text-sm mb-1">Notificaciones de vencimiento</h3>
              <p class="text-xs text-slate-600 dark:text-slate-400 mb-3">
                Avisos: <strong>cliente · servicio · cuándo vence</strong>. Se repiten <strong>2 veces</strong> y suenan.
                Estado: <strong id="notif-status">${((window.Notify || (typeof Notify !== "undefined" ? Notify : null)) && (window.Notify || Notify).statusLabel()) || "—"}</strong>
              </p>
              <div class="flex flex-wrap gap-2">
                <button class="btn btn-sm btn-primary" onclick="App.enableNotifications()">
                  <i data-lucide="bell" class="w-3.5 h-3.5"></i> Activar / reintentar
                </button>
                <button class="btn btn-sm btn-secondary" onclick="App.testNotification()">
                  Probar aviso
                </button>
              </div>
              <p class="text-[11px] text-slate-500 mt-2">
                Si Chrome no deja el permiso: igual verás avisos <strong>dentro de la app</strong> (banner azul arriba) con sonido.
                Para notificaciones del sistema en Android, abrí la app por un <strong>enlace https</strong> (no el archivo descargado).
              </p>
            </div>
          </div>
        </div>

        <!-- Settings quick -->
        <div class="card p-4 flex flex-wrap items-center gap-4 justify-between">
          <div class="flex items-center gap-2 text-sm">
            <i data-lucide="settings" class="w-4 h-4 text-slate-400"></i>
            <span>Alertar <strong>${settings.alertDays} días</strong> antes del vencimiento</span>
          </div>
          <div class="flex items-center gap-2">
            <input type="number" id="alert-days-input" class="form-input w-20" min="1" max="30" value="${settings.alertDays}">
            <button class="btn btn-sm btn-secondary" onclick="App.updateAlertDays()">Guardar</button>
          </div>
        </div>
        
        <!-- Expiring soon -->
        <div>
          <h3 class="font-semibold mb-3 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
            Por vencer (${expiring.length})
          </h3>
          ${expiring.length ? `<div class="space-y-3">${expiring.map(c => makeCard(c, 'expiring')).join('')}</div>` : 
            `<div class="card empty-state py-10"><i data-lucide="check-circle" class="w-10 h-10 text-green-500 mb-2"></i><p>Todo al día. No hay vencimientos próximos.</p></div>`}
        </div>
        
        <!-- Pending payments -->
        <div>
          <h3 class="font-semibold mb-3 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-yellow-500"></span>
            Pagos pendientes (${pending.length})
          </h3>
          ${pending.length ? `<div class="space-y-3">${pending.map(c => makeCard(c, 'pending')).join('')}</div>` : 
            `<div class="card empty-state py-8"><p class="text-slate-400">No hay pagos pendientes</p></div>`}
        </div>
        
        <!-- Expired -->
        <div>
          <h3 class="font-semibold mb-3 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-red-500"></span>
            Vencidos sin renovar (${expired.length})
          </h3>
          ${expired.length ? `<div class="space-y-3">${expired.slice(0, 20).map(c => makeCard(c, 'expired')).join('')}</div>` : 
            `<div class="card empty-state py-8"><p class="text-slate-400">No hay contratos vencidos</p></div>`}
        </div>
      </div>
    `;
  },

  // ========== ADMIN ==========
  admin() {
    if (!DB.isAdmin()) {
      return `<div class="card p-6 text-center text-slate-500">Solo el administrador puede ver esta sección.</div>`;
    }
    const users = (DB.getUsers && DB.getUsers()) || [];
    const list = users.map((u) => {
      const isMain = (u.username || '') === 'admin';
      return `
        <div class="card p-4 flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
          <div class="min-w-0">
            <div class="font-semibold">${u.name || u.username}</div>
            <div class="text-sm text-slate-500">@${u.username}</div>
          </div>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="btn btn-sm btn-primary" onclick="App.openDistributeModal()">Compartir</button>
            <button type="button" class="btn btn-sm btn-secondary" onclick="App.openUserModal('${u.id}')">Editar</button>
            ${!isMain ? `<button type="button" class="btn btn-sm btn-secondary" onclick="App.resetUserData('${u.id}')">Reset</button>
            <button type="button" class="btn btn-sm btn-danger" onclick="App.deleteUser('${u.id}')">Eliminar</button>` : ''}
          </div>
        </div>`;
    }).join('') || '<p class="text-slate-500 text-sm p-2">Todavía no hay usuarios. Usá el botón de arriba.</p>';

    return `
      <div class="space-y-4">
        <div class="card p-5 border-2 border-sky-500 bg-sky-50 dark:bg-sky-950/30">
          <h3 class="text-xl font-bold mb-2">Usuarios del panel</h3>
          <p class="text-sm text-slate-600 dark:text-slate-300 mb-4">
            Creá cuentas para que otros usen el <strong>mismo link</strong>.
            Vos no necesitás “cambiar a usuario”: Dashboard/Clientes/Ventas son siempre <strong>tus</strong> datos de admin.
          </p>
          <button type="button" class="btn btn-primary w-full sm:w-auto py-3 px-6 text-base" onclick="App.openUserModal()">
            + Crear usuario (login y contraseña)
          </button>
          <button type="button" class="btn btn-secondary w-full sm:w-auto mt-2 sm:mt-0 sm:ml-2 py-3" onclick="App.openDistributeModal()">
            Compartir acceso WhatsApp
          </button>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div class="card p-3 text-center"><div class="text-2xl font-bold">${users.length}</div><div class="text-xs text-slate-500">Total</div></div>
          <div class="card p-3 text-center"><div class="text-2xl font-bold">${users.filter(u=>u.role==='admin').length}</div><div class="text-xs text-slate-500">Admins</div></div>
          <div class="card p-3 text-center"><div class="text-2xl font-bold">${users.filter(u=>u.role!=='admin').length}</div><div class="text-xs text-slate-500">Usuarios</div></div>
        </div>
        <div>
          <h4 class="font-semibold mb-2">Listado</h4>
          <div class="space-y-2">${list}</div>
        </div>
      </div>
    `;
  }


};

window.Pages = Pages;
</script>
  <script>/**
 * GestorPro - Main Application (Multi-usuario + Admin)
 */

const App = {
  currentPage: 'dashboard',

  init() {
    // Fondo seguro (evita pantalla negra al reabrir en Android)
    try {
      document.documentElement.style.background = '#0f172a';
      document.body.style.background = '#0f172a';
      document.body.style.minHeight = '100vh';
    } catch (e) {}

    try {
      if (window.DB && DB.applyPreload) DB.applyPreload();
      if (window.DB) DB.getUsers();
      this.initTheme();
      const session = DB.getSession();
      if (!session || !session.userId) {
        this.showLogin();
        return;
      }
      // Validar que el usuario de la sesión aún exista
      const u = DB.getUserById(session.userId) || DB.getUserByUsername(session.username);
      if (!u || u.active === false) {
        DB.clearSession();
        this.showLogin();
        return;
      }
      this.showApp();
    } catch (err) {
      console.error(err);
      try { this.showLogin(); } catch (e) {
        document.body.innerHTML = '<div style="padding:24px;font-family:system-ui;color:#fff;background:#0f172a;min-height:100vh;"><h1>GestorPro</h1><p>Error al cargar. Cerrá Chrome y abrí de nuevo el archivo desde Descargas.</p><p style="color:#fca5a5;">' + (err && err.message ? err.message : err) + '</p></div>';
      }
    }
  },

  // ========== LOGIN ==========
  showLogin() {
    try { document.getElementById('app')?.classList.add('hidden'); } catch (e) {}
    let loginEl = document.getElementById('login-screen');
    if (!loginEl) {
      loginEl = document.createElement('div');
      loginEl.id = 'login-screen';
      document.body.appendChild(loginEl);
    }
    loginEl.classList.remove('hidden');
    loginEl.style.cssText = 'position:fixed;inset:0;z-index:9998;overflow:auto;background:linear-gradient(160deg,#0f172a,#1e293b 50%,#312e81);';
    loginEl.innerHTML = `
      <div style="min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;">
        <div style="width:100%;max-width:400px;">
          <div style="text-align:center;margin-bottom:24px;">
            <div style="width:64px;height:64px;margin:0 auto 12px;border-radius:16px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 12px 28px rgba(14,165,233,.35);">📦</div>
            <h1 style="margin:0;color:#fff;font-size:26px;font-weight:800;font-family:system-ui,sans-serif;">GestorPro</h1>
            <p style="margin:6px 0 0;color:#94a3b8;font-size:13px;font-family:system-ui,sans-serif;">OvaDigital · Perfiles & Servicios</p>
          </div>
          <div style="background:#ffffff;border-radius:16px;padding:22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.35);">
            <h2 style="margin:0 0 4px;font-size:17px;font-weight:700;color:#0f172a;font-family:system-ui,sans-serif;">Iniciar sesión</h2>
            <p style="margin:0 0 16px;font-size:13px;color:#475569;font-family:system-ui,sans-serif;">Ingresá tu usuario y contraseña</p>
            <form id="login-form" autocomplete="on">
              <label style="display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px;font-family:system-ui,sans-serif;">Usuario</label>
              <input type="text" id="login-user" name="username" required autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="tu_usuario"
                style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;margin-bottom:12px;font-family:system-ui,sans-serif;color:#0f172a;background:#fff;-webkit-text-fill-color:#0f172a;caret-color:#0f172a;" />
              <label style="display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px;font-family:system-ui,sans-serif;">Contraseña</label>
              <div style="position:relative;margin-bottom:12px;">
                <input type="password" id="login-pass" name="password" required autocomplete="current-password" placeholder="Tu contraseña"
                  style="width:100%;box-sizing:border-box;padding:12px 44px 12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:system-ui,sans-serif;color:#0f172a;background:#fff;-webkit-text-fill-color:#0f172a;caret-color:#0f172a;" />
                <button type="button" id="toggle-pass" aria-label="Ver contraseña"
                  style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#f1f5f9;color:#334155;border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:16px;line-height:1;">👁️</button>
              </div>
              <div id="login-error" style="display:none;font-size:13px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px;margin-bottom:12px;font-family:system-ui,sans-serif;"></div>
              <button type="submit" id="login-submit" style="width:100%;box-sizing:border-box;padding:14px;border:0;border-radius:10px;background:#0ea5e9;color:#ffffff;font-size:16px;font-weight:700;cursor:pointer;font-family:system-ui,sans-serif;">
                Entrar
              </button>
            </form>
            <p style="margin:16px 0 0;text-align:center;font-size:12px;color:#64748b;font-family:system-ui,sans-serif;">Si no tenés usuario, pedíselo al administrador.</p>
          </div>
        </div>
      </div>
    `;

    const passInput = document.getElementById('login-pass');
    const toggleBtn = document.getElementById('toggle-pass');
    if (toggleBtn && passInput) {
      toggleBtn.onclick = () => {
        const show = passInput.type === 'password';
        passInput.type = show ? 'text' : 'password';
        toggleBtn.textContent = show ? '🙈' : '👁️';
        toggleBtn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Ver contraseña');
      };
    }

    document.getElementById('login-form').onsubmit = (e) => {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      try {
        const username = document.getElementById('login-user').value.trim();
        const password = document.getElementById('login-pass').value;
        // Cloud mode: async login is bound by cloud-bridge; local fallback:
        if (window.__GESTORPRO_CLOUD__ && DB._cloudLogin) {
          return; // cloud-bridge rebinds this form
        }
        const result = DB.verifyLogin(username, password);
        if (result.error) {
          errEl.style.display = 'block';
          errEl.textContent = result.error;
          return;
        }
        DB.setSession(result.user);
        this.showApp();
      } catch (err) {
        errEl.style.display = 'block';
        errEl.textContent = 'Error: ' + (err.message || err);
      }
    };
  },

  showApp() {
    try {
      const loginEl = document.getElementById('login-screen');
      if (loginEl) loginEl.classList.add('hidden');
      const appEl = document.getElementById('app');
      if (appEl) appEl.classList.remove('hidden');

      this.updateUserUI();
      this.bindAppEvents();
      this.setupInstallPrompt();
      this.registerPWA();

      const N = this._notify();
      if (N) {
        try {
          N.startWatching();
          setTimeout(() => N.checkAndNotify(), 1000);
        } catch (e) { console.warn(e); }
      }

      const dateEl = document.getElementById('current-date');
      if (dateEl) {
        dateEl.textContent = new Date().toLocaleDateString('es-ES', {
          weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });
      }

      this.navigate('dashboard'); // admin y usuario empiezan en su panel de trabajo
      this.updateAlertBadge();
    } catch (err) {
      console.error('showApp', err);
      alert('Error al abrir el panel: ' + (err.message || err));
    }
  },

  updateUserUI() {
    const session = DB.getSession();
    if (!session) return;

    // Show/hide admin nav (only pure admin, not when impersonating as restriction already in navigate)
    const adminNav = document.getElementById('nav-admin');
    if (adminNav) {
      adminNav.classList.toggle('hidden', session.role !== 'admin');
    }

    // User badge + logout in sidebar footer
    let badge = document.getElementById('user-badge');
    const exportBtn = document.getElementById('btn-export');
    const footer = exportBtn ? exportBtn.parentElement : document.querySelector('#sidebar .border-t');
    if (!badge && footer) {
      badge = document.createElement('div');
      badge.id = 'user-badge';
      badge.className = 'mb-2 px-2.5 py-2 rounded-lg bg-slate-100 dark:bg-slate-800/80 text-sm border border-slate-200 dark:border-slate-700';
      footer.insertBefore(badge, footer.firstChild);
    }
    if (badge) {
      const imp = session.impersonating ? DB.getUserById(session.impersonating) : null;
      const displayName = session.name || session.username || 'Usuario';
      const roleLabel = session.role === 'admin' ? 'Administrador' : 'Usuario';
      badge.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0 flex-1">
            <div class="font-semibold text-sm truncate text-slate-800 dark:text-slate-100">${displayName}</div>
            <div class="text-[11px] text-slate-500 truncate">
              @${session.username} · ${roleLabel}
              ${imp ? `<br><span class="text-amber-600 font-medium">Viendo: ${imp.username}</span>` : ''}
            </div>
          </div>
          <button type="button" id="btn-logout" class="btn-icon btn-ghost shrink-0 text-red-500" title="Cerrar sesión">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
        <button type="button" id="btn-logout-full" class="mt-2 w-full btn btn-sm btn-secondary text-red-600 dark:text-red-400">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Cerrar sesión
        </button>
        ${session.impersonating ? `
          <button type="button" id="btn-stop-impersonate" class="mt-1.5 w-full btn btn-sm btn-secondary">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Volver a mi panel
          </button>
        ` : ''}
      `;
      if (window.lucide) lucide.createIcons({ nodes: [badge] });
      const doLogout = () => this.logout();
      document.getElementById('btn-logout')?.addEventListener('click', doLogout);
      document.getElementById('btn-logout-full')?.addEventListener('click', doLogout);
      document.getElementById('btn-stop-impersonate')?.addEventListener('click', () => this.stopImpersonate());
    }
  },
  bindAppEvents() {
    if (this._eventsBound) return;
    this._eventsBound = true;

    // Delegación: un solo listener (más estable en móvil)
    const sidebar = document.getElementById('sidebar');
    if (sidebar && !sidebar._navBound) {
      sidebar._navBound = true;
      sidebar.addEventListener('click', (e) => {
        const btn = e.target.closest('.nav-item');
        if (!btn || !btn.dataset.page) return;
        e.preventDefault();
        this.navigate(btn.dataset.page);
      });
    }

    document.getElementById('menu-toggle')?.addEventListener('click', () => this.toggleSidebar());
    document.getElementById('sidebar-overlay')?.addEventListener('click', () => this.closeSidebar());
    document.getElementById('btn-new-contract')?.addEventListener('click', () => this.openContractModal());
    document.getElementById('btn-export')?.addEventListener('click', () => this.exportData());
    document.getElementById('btn-import')?.addEventListener('click', () => document.getElementById('import-file').click());
    document.getElementById('import-file')?.addEventListener('change', (e) => this.importData(e));
    document.getElementById('theme-toggle')?.addEventListener('click', () => this.toggleTheme());

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') Components.closeModal();
    });
  },

  logout() {
    const Nstop = this._notify();
    if (Nstop) Nstop.stopWatching();
    DB.clearSession();
    this._eventsBound = false;
    this.showLogin();
  },

  _notify() {
    return window.Notify || (typeof Notify !== 'undefined' ? Notify : null);
  },

  async enableNotifications() {
    localStorage.setItem('gestorpro_inapp_alerts', '1');
    const N = this._notify();
    if (!N) {
      Utils.toast('Avisos no disponibles (módulo no cargó)', 'error');
      return;
    }
    N.startWatching();
    let systemOk = false;
    try {
      const r = await N.requestPermission();
      systemOk = !!(r && r.ok);
    } catch (e) {}

    try { if (N._audioCtx && N._audioCtx.state === "suspended") N._audioCtx.resume(); } catch (e) {}
    N.playBeep();
    N.showInApp(
      'GestorPro · Avisos activados',
      systemOk
        ? 'Sistema + internos listos.\nCliente · servicio · fecha (2 veces + sonido).'
        : 'Avisos internos listos (banner azul + sonido).\nLas del sistema no están en archivo local; igual te avisa DENTRO de la app.'
    );
    Utils.toast(systemOk ? 'Notificaciones activadas' : 'Avisos internos activados', 'success');
    const st = document.getElementById('notif-status');
    if (st) st.textContent = N.statusLabel();
  },

  testNotification() {
    const N = this._notify();
    if (!N) {
      Utils.toast('Avisos no disponibles (módulo no cargó)', 'error');
      return;
    }
    localStorage.setItem('gestorpro_inapp_alerts', '1');
    N.playBeep();

  registerPWA() {
    try {
      if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;

      // Manifest dinámico (icono simple)
      const manifest = {
        name: 'GestorPro',
        short_name: 'GestorPro',
        start_url: location.pathname || '/',
        display: 'standalone',
        background_color: '#0f172a',
        theme_color: '#0f172a',
        lang: 'es',
        icons: [{
          src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#0ea5e9"/><text x="64" y="84" text-anchor="middle" font-size="64">📦</text></svg>'),
          sizes: '128x128',
          type: 'image/svg+xml',
          purpose: 'any maskable'
        }]
      };
      const mBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const mUrl = URL.createObjectURL(mBlob);
      let link = document.querySelector('link[rel="manifest"]');
      if (!link) {
        link = document.createElement('link');
        link.rel = 'manifest';
        document.head.appendChild(link);
      }
      link.href = mUrl;

      // Service worker mínimo: cache de la propia página
      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE = 'gestorpro-v1';
          self.addEventListener('install', (e) => {
            e.waitUntil(caches.open(CACHE).then(c => c.addAll([self.registration.scope])));
            self.skipWaiting();
          });
          self.addEventListener('activate', (e) => { e.waitUntil(self.clients.claim()); });
          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match(self.registration.scope)))
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      }
    } catch (e) {
      console.warn('PWA setup', e);
    }
  },

  // ========== NAVIGATION ==========
  navigate(page) {
    try {
      if (page === 'admin' && !DB.isAdmin()) page = 'dashboard';

      // Cerrar menú móvil al toque (antes de pintar)
      try { this.closeSidebar(); } catch (e) {}

      // Destruir gráfico viejo ANTES de borrar el DOM (evita cuelgues)
      if (window._chartMonthly) {
        try { window._chartMonthly.destroy(); } catch (e) {}
        window._chartMonthly = null;
      }

      this.currentPage = page;

      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === page);
      });

      const titles = {
        dashboard: { title: 'Dashboard', subtitle: 'Resumen general' },
        clients: { title: 'Clientes', subtitle: 'Tus clientes' },
        services: { title: 'Servicios', subtitle: 'Catálogo' },
        contracts: { title: 'Contratos / Ventas', subtitle: 'Ventas y vencimientos' },
        reports: { title: 'Reportes', subtitle: 'Ganancias' },
        alerts: { title: 'Alertas', subtitle: 'Vencimientos y pagos' },
        admin: { title: 'Administrador', subtitle: 'Usuarios y configuración' }
      };
      const t = titles[page] || { title: page, subtitle: '' };
      const titleEl = document.getElementById('page-title');
      const subEl = document.getElementById('page-subtitle');
      if (titleEl) titleEl.textContent = t.title;
      if (subEl) subEl.textContent = t.subtitle;

      try { this.renderImpersonateBanner(); } catch (e) {}

      const content = document.getElementById('page-content');
      if (!content) return;

      // Pintar YA (sin esperar iconos ni charts)
      if (Pages[page]) {
        content.innerHTML = Pages[page]();
      } else {
        content.innerHTML = '<div class="p-4 text-slate-500">Página no encontrada</div>';
      }

      // Iconos y gráficos en segundo plano (no bloquean la UI)
      const runAfter = () => {
        try {
          if (window.lucide && content) {
            lucide.createIcons({ nodes: [content] });
          }
        } catch (e) {
          try { if (window.lucide) lucide.createIcons(); } catch (e2) {}
        }
        try {
          const after = 'after' + page.charAt(0).toUpperCase() + page.slice(1);
          if (Pages[after]) Pages[after]();
        } catch (e) {
          console.warn('after page', e);
        }
        try { this.updateAlertBadge(); } catch (e) {}
      };

      // Doble rAF: deja que el browser pinte el HTML primero
      requestAnimationFrame(() => {
        requestAnimationFrame(runAfter);
      });
    } catch (err) {
      console.error('navigate error', err);
      try {
        Utils.toast('Error al cambiar de pestaña: ' + (err.message || err), 'error');
      } catch (e) {}
    }
  },

  renderImpersonateBanner() {
    let banner = document.getElementById('impersonate-banner');
    const session = DB.getSession();
    if (session && session.impersonating) {
      const u = DB.getUserById(session.impersonating);
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'impersonate-banner';
        const main = document.querySelector('main');
        if (main) {
          const header = main.querySelector('header');
          if (header && header.nextSibling) main.insertBefore(banner, header.nextSibling);
          else main.appendChild(banner);
        }
      }
      banner.className = 'bg-amber-500 text-amber-950 text-sm px-4 py-2 flex items-center justify-between gap-2';
      banner.innerHTML = '<span><strong>Modo admin:</strong> datos de <strong>' + (u && (u.name || u.username) || '') + '</strong></span><button class="underline font-medium" onclick="App.stopImpersonate()">Salir</button>';
      banner.classList.remove('hidden');
    } else if (banner) {
      banner.classList.add('hidden');
    }
  },

  refresh() {

  updateAlertBadge() {
    if (!DB.getSession()) return;
    const stats = DB.getStats();
    const badge = document.getElementById('alert-badge');
    if (!badge) return;
    const total = stats.expiringSoon +
      DB.getContracts().filter(c => c.paymentStatus === 'pending' || c.paymentStatus === 'partial').length;
    if (total > 0) {
      badge.textContent = total;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }

              <button type="button" id="user-toggle-pass" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#e2e8f0;border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:16px;">👁️</button>

          </div>

      </div>
    `);
    try { if (window.lucide) lucide.createIcons(); } catch (e) {}
    const pass = document.getElementById('user-password');
    const tog = document.getElementById('user-toggle-pass');
    if (tog && pass) {
      tog.onclick = () => {
        const show = pass.type === 'password';
        pass.type = show ? 'text' : 'password';
        tog.textContent = show ? '🙈' : '👁️';
      };
    }
    document.getElementById('user-form').onsubmit = async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('user-form-error');
      const btn = document.getElementById('user-form-submit');
      const name = (document.getElementById('user-name')?.value || '').trim();
      const username = (document.getElementById('user-username')?.value || '').trim();
      const password = document.getElementById('user-password')?.value || '';
      const token = localStorage.getItem('gestorpro_cloud_token') || '';
      try {
        if (errEl) errEl.style.display = 'none';
        if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
        if (window.__GESTORPRO_CLOUD__) {
          if (isEdit) {
            const body = { name: name || username };
            if (password) body.password = password;
            if (user.username !== 'admin') body.active = !!document.getElementById('user-active')?.checked;
            const r = await fetch('/api/users/' + encodeURIComponent(user.id), {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', 'X-Session-Token': token },
              body: JSON.stringify(body)

          } else {
            if (!username || !password) throw new Error('Completá usuario y contraseña');
            if (password.length < 4) throw new Error('Contraseña mínimo 4 caracteres');
            const r = await fetch('/api/users', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Session-Token': token },
              body: JSON.stringify({ username, password, name: name || username })
            });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(d.error || 'No se pudo crear');
            if (DB._cloudLoadUsers) await DB._cloudLoadUsers();
            Components.closeModal();
            this.refresh();
            Utils.toast('Usuario creado', 'success');
            setTimeout(() => this.shareAccessMessage({ username, password, name: name || username }), 250);
            return;
          }
          Components.closeModal();
          this.refresh();
          return;
        }
        if (isEdit) {
          const updates = { name: name || username };
          if (password) updates.password = password;
          const r = DB.updateUser(user.id, updates);
          if (r.error) throw new Error(r.error);
          Utils.toast('Usuario actualizado', 'success');
        } else {
          const r = DB.createUser({ username, password, name: name || username, role: 'user' });
          if (r.error) throw new Error(r.error);
          Components.closeModal();
          this.refresh();
          setTimeout(() => this.shareAccessMessage({ username, password, name: name || username }), 250);
          return;
        }
        Components.closeModal();
        this.refresh();
      } catch (err) {
        if (errEl) { errEl.style.display = 'block'; errEl.textContent = err.message || String(err); }
        else Utils.toast(err.message || 'Error', 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = isEdit ? 'Guardar' : 'Crear y compartir acceso'; }
      }
    };
